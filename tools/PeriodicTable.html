<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>インタラクティブ元素周期表</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #0a0a1a;
  color: #e0e0e0;
  font-family: 'Helvetica Neue', 'Arial', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
  overflow: hidden;
  height: 100vh;
  width: 100vw;
  display: flex;
  flex-direction: column;
}

/* ===== Header ===== */
#header {
  text-align: center;
  padding: 0.5vh 0;
}
#header h1 {
  font-size: clamp(14px, 1.6vw, 24px);
  font-weight: 300;
  letter-spacing: 0.1em;
  color: #aaa;
}

/* ===== Periodic Table ===== */
#table-wrapper {
  display: flex;
  justify-content: center;
  align-items: center;
  flex: 1;
  min-height: 0;
  padding: 0.5vh 1vw;
}

#periodic-table {
  display: grid;
  grid-template-columns: repeat(18, 1fr);
  grid-template-rows: repeat(7, 1fr) 0.3fr repeat(2, 1fr);
  gap: 2px;
  width: 100%;
  max-width: 1500px;
  height: 100%;
}

.element-cell {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 3px;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s, opacity 0.3s;
  background: var(--cat-bg, rgba(100,100,200,0.15));
  overflow: hidden;
}

.element-cell:hover {
  transform: scale(1.08);
  z-index: 5;
  box-shadow: 0 0 12px var(--cat-color, rgba(100,200,255,0.5));
  border-color: var(--cat-color, rgba(100,200,255,0.8));
}

.element-cell.dimmed {
  opacity: 0.2;
}

.element-cell .atomic-number {
  font-size: clamp(6px, 0.6vw, 10px);
  color: rgba(255,255,255,0.5);
  position: absolute;
  top: 2px;
  left: 4px;
}

.element-cell .symbol {
  font-size: clamp(10px, 1.4vw, 20px);
  font-weight: bold;
  color: var(--cat-color, #fff);
  line-height: 1;
}

.element-cell .name {
  font-size: clamp(5px, 0.5vw, 9px);
  color: rgba(255,255,255,0.4);
  margin-top: 1px;
}

.element-cell.placeholder {
  background: rgba(80,80,120,0.1);
  cursor: pointer;
  justify-content: center;
  align-items: center;
}

.element-cell.placeholder .placeholder-text {
  font-size: clamp(6px, 0.7vw, 11px);
  color: rgba(255,255,255,0.3);
}

/* Category legend */
#legend {
  flex-shrink: 0;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px;
  padding: 4px 10px 6px;
  font-size: clamp(7px, 0.6vw, 10px);
  z-index: 1;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 3px;
  color: rgba(255,255,255,0.5);
}
.legend-color {
  width: 8px;
  height: 8px;
  border-radius: 2px;
}

/* ===== Zoom Overlay ===== */
#zoom-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 1000;
  pointer-events: none;
  background: rgba(0,0,0,0);
  transition: background 0.6s ease;
}

#zoom-overlay.active {
  background: rgba(0,0,0,0.88);
  pointer-events: auto;
}

.zoom-frame {
  position: absolute;
  border: 1.5px solid rgba(255,255,255,0.25);
  background: #0d0d22;
  border-radius: 6px;
  transition: left 0.65s cubic-bezier(0.4,0,0.2,1),
              top 0.65s cubic-bezier(0.4,0,0.2,1),
              width 0.65s cubic-bezier(0.4,0,0.2,1),
              height 0.65s cubic-bezier(0.4,0,0.2,1),
              border-color 0.65s ease,
              transform 0.5s cubic-bezier(0.4,0,0.2,1);
  overflow: hidden;
}

/* Content layer (slides during navigation) */
.content-layer {
  position: absolute;
  inset: 0;
  transition: transform 0.5s cubic-bezier(0.4,0,0.2,1), opacity 0.4s ease;
}

/* Moving elements: number, symbol, name */
.mv-number {
  position: absolute;
  left: 50%; top: 6%;
  transform: translateX(-50%);
  font-size: clamp(8px, 1vw, 16px);
  color: rgba(255,255,255,0.5);
  transition: left 0.65s cubic-bezier(0.4,0,0.2,1),
              top 0.65s cubic-bezier(0.4,0,0.2,1),
              font-size 0.65s cubic-bezier(0.4,0,0.2,1),
              transform 0.65s cubic-bezier(0.4,0,0.2,1);
}

.mv-symbol {
  position: absolute;
  left: 50%; top: 45%;
  transform: translate(-50%, -50%);
  font-size: clamp(14px, 2.2vw, 40px);
  font-weight: bold;
  line-height: 1;
  transition: left 0.65s cubic-bezier(0.4,0,0.2,1),
              top 0.65s cubic-bezier(0.4,0,0.2,1),
              font-size 0.65s cubic-bezier(0.4,0,0.2,1),
              transform 0.65s cubic-bezier(0.4,0,0.2,1),
              color 0.4s ease;
}

.mv-name {
  position: absolute;
  left: 50%; top: 80%;
  transform: translateX(-50%);
  font-size: clamp(6px, 0.7vw, 12px);
  color: rgba(255,255,255,0.5);
  white-space: nowrap;
  transition: left 0.65s cubic-bezier(0.4,0,0.2,1),
              top 0.65s cubic-bezier(0.4,0,0.2,1),
              font-size 0.65s cubic-bezier(0.4,0,0.2,1),
              transform 0.65s cubic-bezier(0.4,0,0.2,1);
}

/* Zoomed positions */
.zoom-frame.zoomed .mv-number {
  left: 3.5%; top: 3.5%;
  transform: none;
  font-size: clamp(14px, 1.8vw, 28px);
}

.zoom-frame.zoomed .mv-symbol {
  left: 3.5%; top: 12%;
  transform: none;
  font-size: clamp(40px, 6vw, 90px);
}

.zoom-frame.zoomed .mv-name {
  left: 3.5%; top: 34%;
  transform: none;
  font-size: clamp(14px, 1.5vw, 24px);
  color: rgba(255,255,255,0.7);
}

/* Detail content */
.detail-content {
  position: absolute;
  inset: 0;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.35s ease 0.25s;
}

.zoom-frame.zoomed .detail-content {
  opacity: 1;
  pointer-events: auto;
}

.back-button {
  position: absolute;
  right: 3.5%; top: 3.5%;
  padding: 6px 16px;
  font-size: clamp(10px, 0.85vw, 14px);
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  color: rgba(255,255,255,0.7);
  border-radius: 4px;
  cursor: pointer;
  z-index: 20;
  opacity: 0;
  transition: opacity 0.3s ease 0.4s, background 0.2s, color 0.2s;
}

.zoom-frame.zoomed .back-button {
  opacity: 1;
}

.back-button:hover {
  background: rgba(255,255,255,0.18);
  color: #fff;
}

.detail-atom-wrapper {
  position: absolute;
  left: 50%;
  top: 48%;
  transform: translate(-50%, -50%);
  width: 38%;
  aspect-ratio: 1;
  min-width: 200px;
  min-height: 200px;
}

.detail-atom-wrapper canvas {
  width: 100%;
  height: 100%;
  cursor: grab;
}

.detail-atom-wrapper canvas:active {
  cursor: grabbing;
}

.atom-hint {
  position: absolute;
  bottom: -20px;
  left: 50%;
  transform: translateX(-50%);
  font-size: clamp(8px, 0.65vw, 11px);
  color: rgba(255,255,255,0.3);
  white-space: nowrap;
}

.detail-info {
  position: absolute;
  right: 3%;
  top: 8%;
  width: 22%;
  min-width: 140px;
}

.detail-info .info-row {
  display: flex;
  justify-content: space-between;
  padding: 5px 0;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  font-size: clamp(9px, 0.8vw, 13px);
}

.detail-info .label {
  color: rgba(255,255,255,0.4);
}

.detail-info .value {
  color: rgba(255,255,255,0.85);
  font-weight: 500;
  text-align: right;
}

.detail-description {
  position: absolute;
  left: 3.5%;
  right: 3.5%;
  bottom: 4%;
  font-size: clamp(9px, 0.85vw, 14px);
  line-height: 1.6;
  color: rgba(255,255,255,0.65);
  max-height: 22%;
  overflow-y: auto;
  padding-right: 8px;
}

.detail-description::-webkit-scrollbar {
  width: 4px;
}
.detail-description::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.2);
  border-radius: 2px;
}

/* Navigation arrows */
.nav-arrow {
  position: fixed;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 50%;
  width: 44px;
  height: 44px;
  color: rgba(255,255,255,0.7);
  font-size: 18px;
  cursor: pointer;
  z-index: 1001;
  transition: background 0.2s, opacity 0.3s, transform 0.2s;
  opacity: 0;
  pointer-events: none;
  text-decoration: none;
  font-weight: 600;
}

.nav-arrow.visible {
  opacity: 1;
  pointer-events: auto;
}

.nav-arrow:hover {
  background: rgba(255,255,255,0.2);
  transform: scale(1.1);
}

.nav-arrow .arrow-label {
  font-size: 10px;
  color: rgba(255,255,255,0.5);
}

.nav-arrow.up { top: 18px; left: 50%; transform: translateX(-50%); }
.nav-arrow.up:hover { transform: translateX(-50%) scale(1.1); }
.nav-arrow.down { bottom: 18px; left: 50%; transform: translateX(-50%); }
.nav-arrow.down:hover { transform: translateX(-50%) scale(1.1); }
.nav-arrow.left { left: 18px; top: 50%; transform: translateY(-50%); }
.nav-arrow.left:hover { transform: translateY(-50%) scale(1.1); }
.nav-arrow.right { right: 18px; top: 50%; transform: translateY(-50%); }
.nav-arrow.right:hover { transform: translateY(-50%) scale(1.1); }
.nav-arrow.up-left { top: 18px; left: 18px; }
.nav-arrow.up-right { top: 18px; right: 18px; }
.nav-arrow.down-left { bottom: 18px; left: 18px; }
.nav-arrow.down-right { bottom: 18px; right: 18px; }

@media (max-width: 600px) {
  .nav-arrow { width: 36px; height: 36px; font-size: 14px; }
  .detail-atom-wrapper { width: 50%; }
  .detail-info { width: 35%; }
}
</style>
</head>
<body>

<div id="header">
  <h1>元 素 周 期 表</h1>
</div>

<div id="table-wrapper">
  <div id="periodic-table"></div>
</div>

<div id="legend"></div>

// ===== State =====
let currentElement = null;
let zoomOverlay = null;
let zoomFrame = null;
let atomAnimation = null;
let isNavigating = false;
let navArrows = [];

// ===== Helper functions =====
function getShells(atomicNumber) {
  const capacities = [2, 8, 18, 32, 32, 18, 8];
  const shells = [];
  let remaining = atomicNumber;
  for (let i = 0; i < capacities.length && remaining > 0; i++) {
    const e = Math.min(remaining, capacities[i]);
    shells.push(e);
    remaining -= e;
  }
  return shells;
}

// Virtual position in the long-form (32-column) periodic table.
// Lanthanides map to period 6 groups 3-17; actinides to period 7 groups 3-17.
// Non-f-block elements in periods 6-7 (Hf-Rn, Rf-Og) shift +14 groups to 18-32.
function getVirtualPos(element) {
  if (element.cat === 'lanthanide') return { p: 6, g: element.g };
  if (element.cat === 'actinide') return { p: 7, g: element.g };
  if (element.p === 6 && element.g >= 4) return { p: 6, g: element.g + 14 };
  if (element.p === 7 && element.g >= 4) return { p: 7, g: element.g + 14 };
  return { p: element.p, g: element.g };
}

function getAdjacent(element) {
  const adjacent = {};
  const vp = getVirtualPos(element);
  const dirs = [
    {dir:'up-left', dp:-1, dg:-1},
    {dir:'up', dp:-1, dg:0},
    {dir:'up-right', dp:-1, dg:1},
    {dir:'left', dp:0, dg:-1},
    {dir:'right', dp:0, dg:1},
    {dir:'down-left', dp:1, dg:-1},
    {dir:'down', dp:1, dg:0},
    {dir:'down-right', dp:1, dg:1},
  ];
  // Middle lanthanides (Ce-Yb, n=58..70) cannot connect upward to non-f-block.
  // Symmetrically, non-lanthanides cannot connect downward to middle lanthanides.
  const isMidLan = element.cat === 'lanthanide' && element.n > 57 && element.n < 71;
  for (const d of dirs) {
    const tp = { p: vp.p + d.dp, g: vp.g + d.dg };
    const neighbor = ELEMENTS.find(e => {
      const nvp = getVirtualPos(e);
      return nvp.p === tp.p && nvp.g === tp.g;
    });
    if (!neighbor) continue;
    // Block: middle lanthanide moving up to non-f-block
    if (isMidLan && d.dp < 0) continue;
    // Block: non-lanthanide moving down to a middle lanthanide
    const neighborIsMidLan = neighbor.cat === 'lanthanide' && neighbor.n > 57 && neighbor.n < 71;
    if (neighborIsMidLan && d.dp > 0) continue;
    adjacent[d.dir] = neighbor;
  }
  return adjacent;
}

// ===== Create periodic table =====
function createPeriodicTable() {
  const table = document.getElementById('periodic-table');
  table.innerHTML = '';

  ELEMENTS.forEach(el => {
    const cell = document.createElement('div');
    cell.className = 'element-cell';
    cell.dataset.n = el.n;
    cell.style.gridColumn = el.g;
    cell.style.gridRow = el.p;
    cell.style.setProperty('--cat-color', CAT_COLORS[el.cat]);
    cell.style.setProperty('--cat-bg', CAT_COLORS[el.cat] + '22');
    cell.innerHTML = `
      <span class="atomic-number">${el.n}</span>
      <span class="symbol">${el.s}</span>
      <span class="name">${el.name}</span>
    `;
    cell.addEventListener('click', () => zoomToElement(el, cell));
    table.appendChild(cell);
  });

  // Placeholder cells
  const laPH = document.createElement('div');
  laPH.className = 'element-cell placeholder';
  laPH.style.gridColumn = 3;
  laPH.style.gridRow = 6;
  laPH.innerHTML = '<span class="placeholder-text">57-71</span>';
  laPH.addEventListener('click', () => {
    const la = ELEMENTS.find(e => e.n === 57);
    zoomToElement(la, laPH);
  });
  table.appendChild(laPH);

  const acPH = document.createElement('div');
  acPH.className = 'element-cell placeholder';
  acPH.style.gridColumn = 3;
  acPH.style.gridRow = 7;
  acPH.innerHTML = '<span class="placeholder-text">89-103</span>';
  acPH.addEventListener('click', () => {
    const ac = ELEMENTS.find(e => e.n === 89);
    zoomToElement(ac, acPH);
  });
  table.appendChild(acPH);

  // Legend
  const legend = document.getElementById('legend');
  legend.innerHTML = '';
  Object.entries(CAT_NAMES).forEach(([key, name]) => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<div class="legend-color" style="background:${CAT_COLORS[key]}"></div>${name}`;
    legend.appendChild(item);
  });
}

// ===== Zoom to element =====
function zoomToElement(element, cellEl) {
  if (zoomOverlay) return;
  const rect = cellEl.getBoundingClientRect();

  // Dim the original cell
  cellEl.classList.add('dimmed');

  // Create overlay
  zoomOverlay = document.createElement('div');
  zoomOverlay.id = 'zoom-overlay';

  // Create frame at cell position
  zoomFrame = document.createElement('div');
  zoomFrame.className = 'zoom-frame';
  zoomFrame.style.left = rect.left + 'px';
  zoomFrame.style.top = rect.top + 'px';
  zoomFrame.style.width = rect.width + 'px';
  zoomFrame.style.height = rect.height + 'px';
  zoomFrame.style.borderColor = CAT_COLORS[element.cat] + '88';

  // Create initial content layer
  const layer = createContentLayer(element);
  zoomFrame.appendChild(layer);

  zoomOverlay.appendChild(zoomFrame);
  document.body.appendChild(zoomOverlay);

  // Store original cell reference
  zoomFrame._originalCell = cellEl;

  // Force reflow then animate
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      const margin = window.innerWidth < 600 ? 28 : 60;
      zoomOverlay.classList.add('active');

      zoomFrame.style.left = margin + 'px';
      zoomFrame.style.top = margin + 'px';
      zoomFrame.style.width = (window.innerWidth - 2 * margin) + 'px';
      zoomFrame.style.height = (window.innerHeight - 2 * margin) + 'px';
      zoomFrame.classList.add('zoomed');

      // After zoom completes
      setTimeout(() => {
        currentElement = element;
        setupNavigation(element);
        const canvas = layer.querySelector('.atom-canvas');
        if (canvas) {
          atomAnimation = new AtomAnimation(canvas, element);
          atomAnimation.start();
        }
      }, 660);
    });
  });
}

// ===== Create content layer =====
function createContentLayer(element) {
  const layer = document.createElement('div');
  layer.className = 'content-layer';

  const shells = getShells(element.n);
  const neutrons = Math.round(element.mass) - element.n;

  layer.innerHTML = `
    <div class="back-button">← 周期表に戻る</div>
    <div class="mv-number">${element.n}</div>
    <div class="mv-symbol" style="color:${CAT_COLORS[element.cat]}">${element.s}</div>
    <div class="mv-name">${element.name}</div>
    <div class="detail-content">
      <div class="detail-atom-wrapper">
        <canvas class="atom-canvas"></canvas>
        <div class="atom-hint">ドラッグで回転</div>
      </div>
      <div class="detail-info">
        <div class="info-row"><span class="label">原子量</span><span class="value">${element.mass}</span></div>
        <div class="info-row"><span class="label">英名</span><span class="value">${element.nameEn}</span></div>
        <div class="info-row"><span class="label">分類</span><span class="value">${CAT_NAMES[element.cat]}</span></div>
        <div class="info-row"><span class="label">常温での状態</span><span class="value">${element.state}</span></div>
        <div class="info-row"><span class="label">陽子数</span><span class="value">${element.n}</span></div>
        <div class="info-row"><span class="label">中性子数</span><span class="value">${neutrons}</span></div>

// ===== Navigation arrows =====
function setupNavigation(element) {
  // Remove old arrows
  navArrows.forEach(a => a.remove());
  navArrows = [];

  const adjacent = getAdjacent(element);
  const arrowSymbols = {
    'up': '↑', 'down': '↓', 'left': '←', 'right': '→',
    'up-left': '↖', 'up-right': '↗', 'down-left': '↙', 'down-right': '↘'
  };

  Object.entries(adjacent).forEach(([dir, el]) => {
    const arrow = document.createElement('div');
    arrow.className = `nav-arrow ${dir}`;
    arrow.innerHTML = `<span>${arrowSymbols[dir]}</span>`;
    arrow.title = `${el.s} - ${el.name}`;
    arrow.addEventListener('click', () => navigateTo(dir));
    document.body.appendChild(arrow);

    // Animate in
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        arrow.classList.add('visible');
      });
    });

    navArrows.push(arrow);
  });
}

// ===== Navigate to adjacent =====
const DIR_MAP = {
  'left': {x:-1, y:0},
  'right': {x:1, y:0},
  'up': {x:0, y:-1},
  'down': {x:0, y:1},
  'up-left': {x:-1, y:-1},
  'up-right': {x:1, y:-1},
  'down-left': {x:-1, y:1},
  'down-right': {x:1, y:1},
};

function navigateTo(direction) {
  if (isNavigating || !currentElement) return;
  const adjacent = getAdjacent(currentElement);
  const target = adjacent[direction];
  if (!target) return;
  isNavigating = true;

  // Stop old animation
  if (atomAnimation) atomAnimation.stop();

  const dir = DIR_MAP[direction];
  const oldLayer = zoomFrame.querySelector('.content-layer');

  // Create new layer — enters FROM the arrow direction
  const newLayer = createContentLayer(target);
  newLayer.style.transform = `translate(${dir.x * 100}%, ${dir.y * 100}%)`;
  newLayer.style.opacity = '0';
  zoomFrame.appendChild(newLayer);

  // Subtle frame nudge in the arrow direction
  const nudge = 15;
  zoomFrame.style.transform = `translate(${dir.x * nudge}px, ${dir.y * nudge}px)`;

  // Force reflow
  newLayer.offsetHeight;

  // Animate: old content exits opposite to arrow direction, new content slides in
  requestAnimationFrame(() => {
    oldLayer.style.transform = `translate(${-dir.x * 100}%, ${-dir.y * 100}%)`;
    oldLayer.style.opacity = '0';
    newLayer.style.transform = 'translate(0, 0)';
    newLayer.style.opacity = '1';

    // Reset frame nudge
    setTimeout(() => {
      zoomFrame.style.transform = 'translate(0, 0)';
    }, 250);
  });

  // After animation
  setTimeout(() => {
    oldLayer.remove();
    currentElement = target;

    // Update frame border color
    zoomFrame.style.borderColor = CAT_COLORS[target.cat] + '88';

    // Update navigation arrows
    setupNavigation(target);

    // Start atom animation
    const canvas = newLayer.querySelector('.atom-canvas');
    if (canvas) {
      atomAnimation = new AtomAnimation(canvas, target);
      atomAnimation.start();
    }

    isNavigating = false;
  }, 500);
}

// ===== Zoom out =====
function zoomOut() {
  if (!zoomFrame || !currentElement || isNavigating) return;
  isNavigating = true;
  const exitingElement = currentElement;

  // Stop atom animation
  if (atomAnimation) {
    atomAnimation.stop();
    atomAnimation = null;
  }

  // Hide arrows
  navArrows.forEach(a => a.classList.remove('visible'));
  setTimeout(() => {
    navArrows.forEach(a => a.remove());
    navArrows = [];
  }, 400);

  // Find the current element's cell
  const cell = document.querySelector(`.element-cell[data-n="${exitingElement.n}"]`);
  const rect = cell ? cell.getBoundingClientRect() : zoomFrame._originalCell.getBoundingClientRect();

  // Undim original cell if it's different
  if (zoomFrame._originalCell) {
    zoomFrame._originalCell.classList.remove('dimmed');
  }
  if (cell) cell.classList.add('dimmed');

  // Remove zoomed class (triggers reverse animation for number/symbol/name)
  zoomFrame.classList.remove('zoomed');

  // Animate frame back to cell position
  zoomFrame.style.left = rect.left + 'px';
  zoomFrame.style.top = rect.top + 'px';
  zoomFrame.style.width = rect.width + 'px';
  zoomFrame.style.height = rect.height + 'px';

  // Remove overlay background
  zoomOverlay.classList.remove('active');

  // After transition
  setTimeout(() => {
    if (cell) cell.classList.remove('dimmed');
    if (zoomOverlay) {
      zoomOverlay.remove();
      zoomOverlay = null;
      zoomFrame = null;
      currentElement = null;
      isNavigating = false;
    }
  }, 660);
}

// ===== Atom Animation =====
class AtomAnimation {
  constructor(canvas, element) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.element = element;
    this.rotX = 0.4;
    this.rotY = 0;
    this.autoRotate = true;
    this.dragging = false;
    this.lastX = 0;
    this.lastY = 0;
    this.running = false;

    this.protons = element.n;
    this.neutrons = Math.max(0, Math.round(element.mass) - element.n);
    this.shells = getShells(element.n);

    this.setupCanvas();
    this.generateParticles();
    this.bindEvents();
    this.animate = this.animate.bind(this);
  }

  setupCanvas() {
    const rect = this.canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    this.canvas.width = rect.width * dpr;
    this.canvas.height = rect.height * dpr;
    this.ctx.scale(dpr, dpr);
    this.cw = rect.width;
    this.ch = rect.height;
  }

  generateParticles() {
    // Nucleus
    this.nucleusParticles = [];
    const total = this.protons + this.neutrons;
    const nucRadius = Math.max(12, Math.min(40, Math.sqrt(total) * 2.5));
    this.nucRadius = nucRadius;

    for (let i = 0; i < this.protons; i++) {
      this.nucleusParticles.push({
        ...this.randomSpherePos(nucRadius),
        type: 'proton',
        color: '#ff6b6b',
        jitter: Math.random() * Math.PI * 2,
      });
    }
    for (let i = 0; i < this.neutrons; i++) {
      this.nucleusParticles.push({
        ...this.randomSpherePos(nucRadius),
        type: 'neutron',
        color: '#5b9bd5',
        jitter: Math.random() * Math.PI * 2,
      });
    }

    // Electron shells
    this.shellData = [];
    this.electrons = [];
    const maxR = Math.min(this.cw, this.ch) * 0.42;
    const minR = nucRadius + 18;

    this.shells.forEach((count, i) => {
      const r = minR + (maxR - minR) * ((i + 1) / this.shells.length);
      const tiltX = i * 0.5;
      const tiltZ = i * 0.3;
      this.shellData.push({ count, radius: r, tiltX, tiltZ });

      for (let j = 0; j < count; j++) {
        this.electrons.push({
          shell: i,
          angle: (j / count) * Math.PI * 2,
          speed: 0.015 + 0.005 / (i + 1),
        });
      }
    });
  }

  randomSpherePos(radius) {
    const r = radius * Math.cbrt(Math.random());
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    return {
      x: r * Math.sin(phi) * Math.cos(theta),
      y: r * Math.sin(phi) * Math.sin(theta),
      z: r * Math.cos(phi),
    };
  }

  bindEvents() {
    const c = this.canvas;
    this._onDown = (e) => {
      this.dragging = true;
      this.autoRotate = false;
      const pt = e.touches ? e.touches[0] : e;
      this.lastX = pt.clientX;
      this.lastY = pt.clientY;
      e.preventDefault();
    };
    this._onMove = (e) => {
      if (!this.dragging) return;
      const pt = e.touches ? e.touches[0] : e;
      const dx = pt.clientX - this.lastX;
      const dy = pt.clientY - this.lastY;
      this.rotY += dx * 0.01;
      this.rotX += dy * 0.01;
      this.lastX = pt.clientX;
      this.lastY = pt.clientY;
    };
    this._onUp = () => { this.dragging = false; };

    c.addEventListener('mousedown', this._onDown);
    document.addEventListener('mousemove', this._onMove);
    document.addEventListener('mouseup', this._onUp);
    c.addEventListener('touchstart', this._onDown, { passive: false });
    document.addEventListener('touchmove', this._onMove, { passive: false });
    document.addEventListener('touchend', this._onUp);
  }

  project3D(x, y, z) {
    const cosY = Math.cos(this.rotY), sinY = Math.sin(this.rotY);
    const x1 = x * cosY - z * sinY;
    const z1 = x * sinY + z * cosY;
    const y1 = y;

    const cosX = Math.cos(this.rotX), sinX = Math.sin(this.rotX);
    const y2 = y1 * cosX - z1 * sinX;
    const z2 = y1 * sinX + z1 * cosX;
    const x2 = x1;

    const persp = 500;
    const scale = persp / (persp + z2);

    return {
      x: this.cw / 2 + x2 * scale,
      y: this.ch / 2 + y2 * scale,
      z: z2,
      scale: scale
    };
  }

  applyTilt(x, y, z, tiltX, tiltZ) {
    const cosTX = Math.cos(tiltX), sinTX = Math.sin(tiltX);
    const y1 = y * cosTX - z * sinTX;
    const z1 = y * sinTX + z * cosTX;
    const x1 = x;

    const cosTZ = Math.cos(tiltZ), sinTZ = Math.sin(tiltZ);
    const x2 = x1 * cosTZ - y1 * sinTZ;
    const y2 = x1 * sinTZ + y1 * cosTZ;

    return { x: x2, y: y2, z: z1 };
  }

  drawOrbitRing(shell) {
    const ctx = this.ctx;
    const segments = 48;
    const points = [];

    for (let i = 0; i <= segments; i++) {
      const angle = (i / segments) * Math.PI * 2;
      const x0 = shell.radius * Math.cos(angle);
      const y0 = shell.radius * Math.sin(angle);
      const z0 = 0;
      const tilted = this.applyTilt(x0, y0, z0, shell.tiltX, shell.tiltZ);
      const projected = this.project3D(tilted.x, tilted.y, tilted.z);
      points.push(projected);
    }

    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    points.forEach((p, i) => {
      if (i === 0) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    });
    ctx.stroke();
  }

  animate() {
    if (!this.running) return;
    const ctx = this.ctx;
    ctx.clearRect(0, 0, this.cw, this.ch);

    if (this.autoRotate) {
      this.rotY += 0.005;
    }

    // Update electron positions
    this.electrons.forEach(e => { e.angle += e.speed; });

    // Draw orbit rings (back half)
    this.shellData.forEach(s => this.drawOrbitRing(s));

    // Collect all particles for z-sorting
    const allParticles = [];
    const time = Date.now() * 0.001;

    // Nucleus particles with jitter
    this.nucleusParticles.forEach((p, i) => {
      const jitter = 2;
      const jx = Math.sin(time * 2 + p.jitter) * jitter;
      const jy = Math.cos(time * 1.8 + p.jitter) * jitter;
      const jz = Math.sin(time * 2.2 + p.jitter * 1.3) * jitter;
      const projected = this.project3D(p.x + jx, p.y + jy, p.z + jz);
      const size = Math.max(2, 5 * projected.scale);
      allParticles.push({
        ...projected,
        color: p.color,
        size: size,
        type: 'nucleus'
      });
    });

    // Electrons
    this.electrons.forEach(e => {
      const shell = this.shellData[e.shell];
      const x0 = shell.radius * Math.cos(e.angle);
      const y0 = shell.radius * Math.sin(e.angle);
      const z0 = 0;
      const tilted = this.applyTilt(x0, y0, z0, shell.tiltX, shell.tiltZ);
      const projected = this.project3D(tilted.x, tilted.y, tilted.z);
      allParticles.push({
        ...projected,
        color: '#00d2ff',
        size: Math.max(1.5, 3.5 * projected.scale),
        type: 'electron'
      });
    });

    // Sort by z (back to front)
    allParticles.sort((a, b) => a.z - b.z);

    // Draw
    allParticles.forEach(p => {
      if (p.type === 'electron') {
        // Glow
        ctx.beginPath();
        ctx.arc(p.x, p.y, Math.max(3, p.size * 2.5), 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0,210,255,0.15)';
        ctx.fill();
      }

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.fill();

      // Highlight
      if (p.size > 2) {
        ctx.beginPath();
        ctx.arc(p.x - p.size * 0.3, p.y - p.size * 0.3, p.size * 0.3, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.fill();
      }
    });

    requestAnimationFrame(this.animate);
  }

  start() {
    this.running = true;
    requestAnimationFrame(this.animate);
  }

  stop() {
    this.running = false;
    // Clean up event listeners
    this.canvas.removeEventListener('mousedown', this._onDown);
    document.removeEventListener('mousemove', this._onMove);
    document.removeEventListener('mouseup', this._onUp);
    this.canvas.removeEventListener('touchstart', this._onDown);
    document.removeEventListener('touchmove', this._onMove);
    document.removeEventListener('touchend', this._onUp);
  }
}

// ===== Keyboard navigation =====
document.addEventListener('keydown', (e) => {
  if (!currentElement) return;
  const keyMap = {
    'ArrowLeft': 'left',
    'ArrowRight': 'right',
    'ArrowUp': 'up',
    'ArrowDown': 'down',
  };
  if (keyMap[e.key]) {
    e.preventDefault();
    navigateTo(keyMap[e.key]);
  } else if (e.key === 'Escape') {
    e.preventDefault();
    zoomOut();
  }
});

// ===== Initialize =====
createPeriodicTable();

// Handle resize
window.addEventListener('resize', () => {
  if (zoomFrame && zoomFrame.classList.contains('zoomed')) {
    const margin = window.innerWidth < 600 ? 28 : 60;
    zoomFrame.style.left = margin + 'px';
    zoomFrame.style.top = margin + 'px';
    zoomFrame.style.width = (window.innerWidth - 2 * margin) + 'px';
    zoomFrame.style.height = (window.innerHeight - 2 * margin) + 'px';
    if (atomAnimation) {
      atomAnimation.setupCanvas();
      atomAnimation.generateParticles();
    }
  }
});

      if (style && style.includes("url(")) {
        elements[index].style.cssText = style.replace(
          /url\(["']?(?!data:)[^)"']*["']?\)/gi,
          "none",
        );
      }
    }
  }

  function emitScroll() {
    scrollRaf = 0;
    if (!scrollForwarding) return;
    postToTrustedTop({
      type: "INLINE_EDIT_SCROLL",
      scrollX: window.scrollX,
      scrollY: window.scrollY,
    });
  }

  window.addEventListener(
    "scroll",
    function () {
      if (!scrollForwarding || scrollRaf) return;
      scrollRaf = requestAnimationFrame(emitScroll);
    },
    { passive: true, capture: true },
  );

  async function handleCaptureRequest(event) {
    const requestId = event.data.requestId;
    const scrollX = window.scrollX;
    const scrollY = window.scrollY;
    const width = window.innerWidth;
    const height = window.innerHeight;

    function postResult(dataUrl) {
      postToTrustedTop({
        type: "INLINE_EDIT_SCREENSHOT_RESULT",
        requestId,
        dataUrl,
        scrollX,
        scrollY,
      });
    }

    try {
      // Wait for any pending web fonts to resolve so both inline metrics and
      // the @font-face inlining below see the same loaded faces.
      if (document.fonts && document.fonts.ready) {
        try {
          await document.fonts.ready;
        } catch (_error) {}
      }

      const clone = document.documentElement.cloneNode(true);
      inlineAll(document.documentElement, clone);

      const removedNodes = clone.querySelectorAll("script,link[rel=\"stylesheet\"],style");
      for (let index = 0; index < removedNodes.length; index += 1) {
        removedNodes[index].remove();
      }

      stripExternal(clone);

      // Re-embed web fonts as data-URI @font-face rules so the SVG rasterizer
      // can resolve them — external font URLs aren't fetched during
      // foreignObject rendering, which would otherwise force a fallback face
      // and change text metrics.
      const inlinedFontCss = await buildInlinedFontCss();
      if (inlinedFontCss) {
        const styleEl = document.createElement("style");
        styleEl.textContent = inlinedFontCss;
        const head = clone.querySelector("head");
        if (head) head.appendChild(styleEl);
        else clone.insertBefore(styleEl, clone.firstChild);
      }

      const html = new XMLSerializer().serializeToString(clone);
      const svg =
        `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}">` +
        '<foreignObject width="100%" height="100%">' +
        `<div xmlns="http://www.w3.org/1999/xhtml" style="width:${width}px;height:${height}px;overflow:hidden">` +
        `<div style="position:relative;left:-${scrollX}px;top:-${scrollY}px">` +
        html +
        "</div></div></foreignObject></svg>";
      const svgUrl = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
      const image = new Image();
      image.onload = function () {
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        canvas.getContext("2d").drawImage(image, 0, 0);
        postResult(canvas.toDataURL("image/png"));
      };
      image.onerror = function () {
        postResult(null);
      };
      image.src = svgUrl;
    } catch (_error) {
      postResult(null);
    }
  }

  window.addEventListener("message", function (event) {
    if (!event.data) return;
    // Only accept messages from the direct parent frame. Blocks sibling /
    // unrelated-window postMessage senders that could otherwise reach us.
    if (event.source !== window.parent) return;

    const trustedParentOrigin = getTrustedParentOrigin(event);
    if (!trustedParentOrigin) return;
    trustedTopOrigin = trustedParentOrigin;

    if (event.data.type === "INLINE_EDIT_SCROLL_START") {
      scrollForwarding = true;
      emitScroll();
      return;
    }

    if (event.data.type === "INLINE_EDIT_SCROLL_STOP") {
      scrollForwarding = false;
      if (scrollRaf) cancelAnimationFrame(scrollRaf);
      scrollRaf = 0;
      return;
    }

    if (event.data.type !== "INLINE_EDIT_CAPTURE_REQUEST") return;

    handleCaptureRequest(event);
  });
})();


</script></body>
</html>
