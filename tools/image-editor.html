<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Pigment — Image editor in your browser</title>
  <meta name="description"
    content="Pigment is an image editor that runs entirely in your browser: curves, crop, saturation, exposure, white balance, sharpen, vignette, brush, rotate and more. Your images are never uploaded.">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #18191c;
      --stage: #26272b;
      --panel: #202125;
      --panel-2: #2a2b30;
      --panel-3: #33343a;
      --line: #36373d;
      --line-2: #46474e;
      --text: #e6e6e9;
      --dim: #9b9ca5;
      --faint: #6d6e76;
      --accent: #f0a640;
      --accent-2: #ffc46b;
      --on-accent: #1b1205;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
      color-scheme: dark;
    }

    html,
    body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font: 13px/1.45 var(--sans);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -webkit-user-select: none;
      user-select: none;
    }

    button {
      font: inherit;
      color: inherit;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }

    /* ─── Menubar ─────────────────────────────── */
    #menubar {
      height: 38px;
      flex: none;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 0 8px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      overflow-x: auto;
      scrollbar-width: none;
    }

    #menubar::-webkit-scrollbar {
      display: none;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      letter-spacing: .02em;
      margin-right: 10px;
      white-space: nowrap;
    }

    .brand-mark {
      width: 18px;
      height: 18px;
      border-radius: 5px;
      background: conic-gradient(from 200deg, #f0a640, #ef6461, #b06cf0, #4fa3ff, #4fd18b, #f0a640);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .15);
    }

    .menu-btn {
      background: none;
      border: 0;
      padding: 5px 9px;
      border-radius: 5px;
      cursor: pointer;
      white-space: nowrap;
    }

    .menu-btn:hover,
    .menu-btn.open {
      background: var(--panel-3);
    }

    .menu-drop {
      position: fixed;
      min-width: 230px;
      background: #2b2c31;
      border: 1px solid var(--line-2);
      border-radius: 8px;
      padding: 5px;
      box-shadow: 0 14px 40px rgba(0, 0, 0, .55);
      z-index: 100;
      display: none;
    }

    .menu-drop.open {
      display: block;
    }

    .menu-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
      width: 100%;
      background: none;
      border: 0;
      padding: 6px 10px;
      border-radius: 5px;
      cursor: pointer;
      text-align: left;
    }

    .menu-item:hover {
      background: var(--accent);
      color: var(--on-accent);
    }

    .menu-item kbd {
      font: 11px var(--mono);
      color: var(--dim);
    }

    .menu-item:hover kbd {
      color: inherit;
      opacity: .75;
    }

    .menu-item.disabled {
      opacity: .38;
      pointer-events: none;
    }

    .menu-sep {
      height: 1px;
      background: var(--line);
      margin: 4px 6px;
    }

    .spacer {
      flex: 1;
    }

    .home-link {
      color: var(--dim);
      text-decoration: none;
      font-size: 12px;
      padding: 5px 8px;
      border-radius: 5px;
      white-space: nowrap;
    }

    .home-link:hover {
      color: var(--text);
      background: var(--panel-3);
    }

    /* ─── Main grid ───────────────────────────── */
    #main {
      flex: 1;
      display: grid;
      grid-template-columns: 212px minmax(0, 1fr) 304px;
      min-height: 0;
    }

    #main.dock-hidden {
      grid-template-columns: 212px minmax(0, 1fr);
    }

    #main.dock-hidden #dock {
      display: none;
    }

    /* ─── Toolbox ─────────────────────────────── */
    #toolbox {
      background: var(--panel);
      border-right: 1px solid var(--line);
      overflow-y: auto;
      padding: 10px;
    }

    .tools {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
    }

    .tool {
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 8px;
      cursor: pointer;
      position: relative;
    }

    .tool svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .tool:hover {
      border-color: var(--line-2);
      background: var(--panel-3);
    }

    .tool.active {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--on-accent);
    }

    .tool .k {
      position: absolute;
      right: 4px;
      bottom: 2px;
      font: 9px var(--mono);
      opacity: .55;
    }

    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--dim);
      margin: 16px 0 8px;
      font-weight: 600;
    }

    .opt {
      display: none;
    }

    .opt.show {
      display: block;
    }

    .hint {
      color: var(--dim);
      font-size: 12px;
      line-height: 1.6;
    }

    .hint kbd,
    .help-table kbd {
      font: 11px var(--mono);
      background: var(--panel-3);
      border: 1px solid var(--line-2);
      border-radius: 4px;
      padding: 0 4px;
      color: var(--text);
    }

    .btn {
      background: var(--panel-3);
      border: 1px solid var(--line-2);
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn:hover {
      background: #3e3f46;
    }

    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--on-accent);
      font-weight: 600;
    }

    .btn.primary:hover {
      background: var(--accent-2);
    }

    .btn.small {
      padding: 3px 8px;
      font-size: 11px;
    }

    .btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--on-accent);
    }

    .btn-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .field {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 7px;
    }

    .field>label {
      color: var(--dim);
      font-size: 12px;
      min-width: 14px;
    }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 8px;
    }

    input[type=number],
    input[type=text],
    select {
      background: #16171a;
      border: 1px solid var(--line-2);
      color: var(--text);
      font: 12px var(--mono);
      padding: 5px 7px;
      border-radius: 5px;
      width: 100%;
      min-width: 0;
      -webkit-user-select: text;
      user-select: text;
    }

    select {
      font-family: var(--sans);
    }

    input:focus-visible,
    select:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    input[type=color] {
      width: 38px;
      height: 30px;
      border: 1px solid var(--line-2);
      border-radius: 6px;
      background: #16171a;
      padding: 2px;
      cursor: pointer;
    }

    .check {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: var(--dim);
      margin: 6px 0 10px;
      cursor: pointer;
    }

    .check input {
      accent-color: var(--accent);
    }

    /* range */
    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 18px;
      background: transparent;
      cursor: pointer;
      --track: linear-gradient(var(--line-2), var(--line-2));
    }

    input[type=range]::-webkit-slider-runnable-track {
      height: 4px;
      border-radius: 2px;
      background: var(--track);
    }

    input[type=range]::-moz-range-track {
      height: 4px;
      border-radius: 2px;
      background: var(--track);
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #f2f2f4;
      border: 2px solid #16171a;
      margin-top: -5px;
      box-shadow: 0 0 0 1px var(--line-2);
    }

    input[type=range]::-moz-range-thumb {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #f2f2f4;
      border: 2px solid #16171a;
    }

    input[type=range]:active::-webkit-slider-thumb {
      background: var(--accent);
    }

    input[type=range]:active::-moz-range-thumb {
      background: var(--accent);
    }

    .r-temp {
      --track: linear-gradient(90deg, #4f8fff, #cfcfcf, #ffb13d) !important;
    }

    .r-tint {
      --track: linear-gradient(90deg, #3fc46a, #cfcfcf, #e05ad6) !important;
    }

    .r-sat {
      --track: linear-gradient(90deg, #7a7a7a, #ff3d6e) !important;
    }

    .r-hue {
      --track: linear-gradient(90deg, #00e5ff, #3d5bff, #e040fb, #ff3d3d, #ffd23d, #3dff6e, #00e5ff) !important;
    }

    .r-exp {
      --track: linear-gradient(90deg, #111, #eee) !important;
    }

    /* ─── Stage ───────────────────────────────── */
    #stage {
      position: relative;
      background: var(--stage);
      overflow: hidden;
      min-width: 0;
      min-height: 0;
      touch-action: none;
    }

    #view {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #empty {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    #empty.hidden {
      display: none;
    }

    .drop-hint {
      border: 1.5px dashed var(--line-2);
      border-radius: 18px;
      padding: 36px 34px;
      max-width: 440px;
      text-align: center;
      background: rgba(0, 0, 0, .12);
    }

    .drop-hint h1 {
      font-size: 22px;
      letter-spacing: .01em;
      margin-bottom: 6px;
    }

    .drop-hint p {
      color: var(--dim);
      margin-bottom: 18px;
    }

    .drop-hint .btn-row {
      justify-content: center;
    }

    .drop-hint .btn {
      padding: 9px 16px;
      font-size: 13px;
    }

    .drop-hint small {
      display: block;
      color: var(--faint);
      margin-top: 16px;
      font-size: 11px;
    }

    #stage.dragover::after {
      content: '';
      position: absolute;
      inset: 10px;
      border: 2px dashed var(--accent);
      border-radius: 12px;
      background: rgba(240, 166, 64, .07);
      pointer-events: none;
    }

    #compare-badge {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, .65);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      letter-spacing: .06em;
      display: none;
      pointer-events: none;
    }

    #compare-badge.show {
      display: block;
    }

    #busy {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(20, 20, 24, .35);
      z-index: 5;
    }

    #busy.show {
      display: flex;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, .15);
      border-top-color: var(--accent);
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ─── Dock ────────────────────────────────── */
    #dock {
      background: var(--panel);
      border-left: 1px solid var(--line);
      overflow-y: auto;
    }

    .panel {
      border-bottom: 1px solid var(--line);
    }

    .panel>summary {
      list-style: none;
      cursor: pointer;
      padding: 10px 12px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--dim);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .panel>summary::-webkit-details-marker {
      display: none;
    }

    .panel>summary::before {
      content: '';
      border-left: 4px solid currentColor;
      border-top: 4px solid transparent;
      border-bottom: 4px solid transparent;
      transition: transform .15s;
    }

    .panel[open]>summary::before {
      transform: rotate(90deg);
    }

    .panel>summary .sum-right {
      margin-left: auto;
      text-transform: none;
      letter-spacing: 0;
      font-weight: 400;
    }

    .panel-body {
      padding: 2px 12px 14px;
    }

    #hist {
      width: 100%;
      height: 92px;
      display: block;
      border-radius: 6px;
      background: #141518;
    }

    .seg {
      display: flex;
      background: #16171a;
      border: 1px solid var(--line-2);
      border-radius: 6px;
      padding: 2px;
      gap: 2px;
      margin-bottom: 8px;
    }

    .seg button {
      flex: 1;
      background: none;
      border: 0;
      padding: 4px 0;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      color: var(--dim);
    }

    .seg button.active {
      background: var(--panel-3);
      color: var(--text);
    }

    .seg button[data-ch=r].active {
      color: #ff7676;
    }

    .seg button[data-ch=g].active {
      color: #5fe09a;
    }

    .seg button[data-ch=b].active {
      color: #6fb4ff;
    }

    #curves {
      width: 100%;
      aspect-ratio: 1;
      display: block;
      border-radius: 6px;
      background: #141518;
      touch-action: none;
      cursor: crosshair;
    }

    .curve-info {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 2px 10px;
      font: 11px var(--mono);
      color: var(--dim);
      margin: 6px 0 8px;
      min-height: 15px;
    }

    .sgroup-title {
      font-size: 11px;
      color: var(--faint);
      margin: 12px 0 4px;
      letter-spacing: .04em;
    }

    .sgroup-title:first-child {
      margin-top: 2px;
    }

    .srow {
      margin-bottom: 4px;
    }

    .srow-head {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--dim);
      cursor: default;
    }

    .srow-head .v {
      font: 11px var(--mono);
      color: var(--text);
    }

    .srow.changed .srow-head span:first-child {
      color: var(--accent-2);
    }

    .presets {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .preset {
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 4px;
      cursor: pointer;
      font-size: 11px;
      color: var(--dim);
      display: flex;
      flex-direction: column;
      gap: 3px;
      align-items: stretch;
    }

    .preset:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    .preset canvas {
      width: 100%;
      aspect-ratio: 3/2;
      object-fit: cover;
      border-radius: 4px;
      background: #141518;
      display: block;
    }

    .layer-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 12px;
    }

    .layer-row input[type=checkbox] {
      accent-color: var(--accent);
    }

    .layer-row .lname {
      flex: 1;
    }

    .layer-row .ldim {
      color: var(--faint);
      font-size: 11px;
    }

    #history {
      list-style: none;
      max-height: 220px;
      overflow-y: auto;
      position: relative;
    }

    #history li button {
      width: 100%;
      text-align: left;
      background: none;
      border: 0;
      padding: 5px 8px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      gap: 8px;
    }

    #history li button:hover {
      background: var(--panel-3);
    }

    #history li.current button {
      background: rgba(240, 166, 64, .16);
      color: var(--accent-2);
    }

    #history li.future button {
      color: var(--faint);
    }

    #history .n {
      font: 10px var(--mono);
      color: var(--faint);
      min-width: 18px;
      padding-top: 2px;
    }

    /* ─── Status ──────────────────────────────── */
    #status {
      height: 30px;
      flex: none;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 8px 0 12px;
      background: var(--panel);
      border-top: 1px solid var(--line);
      font: 11px var(--mono);
      color: var(--dim);
      white-space: nowrap;
      overflow: hidden;
    }

    .swatch {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      border: 1px solid var(--line-2);
      display: inline-block;
      vertical-align: -2px;
      margin-right: 4px;
    }

    .zoomctl {
      display: flex;
      align-items: center;
      gap: 1px;
      margin-left: auto;
    }

    .zbtn {
      background: none;
      border: 0;
      padding: 3px 7px;
      border-radius: 4px;
      cursor: pointer;
      font: 11px var(--mono);
      color: var(--text);
    }

    .zbtn:hover {
      background: var(--panel-3);
    }

    .zbtn.active {
      background: var(--accent);
      color: var(--on-accent);
    }

    #zoom-label {
      min-width: 48px;
      text-align: center;
    }

    /* ─── Modal / toast ───────────────────────── */
    #modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 16px;
    }

    #modal.open {
      display: flex;
    }

    #modal.peek {
      background: transparent;
      pointer-events: none;
      align-items: flex-start;
      justify-content: flex-end;
      padding-top: 52px;
    }

    .dialog {
      background: #25262b;
      border: 1px solid var(--line-2);
      border-radius: 12px;
      width: min(420px, 100%);
      box-shadow: 0 20px 60px rgba(0, 0, 0, .6);
      max-height: calc(100dvh - 32px);
      overflow: auto;
      pointer-events: auto;
    }

    .dialog h2 {
      font-size: 14px;
      padding: 13px 16px;
      border-bottom: 1px solid var(--line);
    }

    .dialog .body {
      padding: 14px 16px;
    }

    .dialog .body .field>label {
      min-width: 74px;
    }

    .dialog .foot {
      padding: 12px 16px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .dialog .note {
      color: var(--dim);
      font-size: 12px;
      margin-top: 6px;
    }

    .help-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    .help-table td {
      padding: 4px 0;
      border-bottom: 1px solid var(--line);
    }

    .help-table td:last-child {
      text-align: right;
    }

    #toast {
      position: fixed;
      left: 50%;
      bottom: 46px;
      transform: translateX(-50%) translateY(16px);
      background: #33343a;
      border: 1px solid var(--line-2);
      padding: 8px 14px;
      border-radius: 8px;
      opacity: 0;
      transition: opacity .2s, transform .2s;
      pointer-events: none;
      z-index: 300;
      max-width: calc(100vw - 32px);
      font-size: 12px;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%);
    }

    /* ─── Mobile ──────────────────────────────── */
    @media (max-width: 860px) {
      body {
        overflow: auto;
      }

      #app {
        height: auto;
        min-height: 100dvh;
      }

      #main,
      #main.dock-hidden {
        display: flex;
        flex-direction: column;
      }

      #main.dock-hidden #dock {
        display: block;
      }

      #toolbox {
        border-right: 0;
        border-bottom: 1px solid var(--line);
        padding: 8px 12px 10px;
        overflow: visible;
      }

      .tools {
        grid-template-columns: repeat(6, 1fr);
      }

      .tool {
        aspect-ratio: auto;
        height: 42px;
      }

      #toolbox .section-title {
        margin: 10px 0 6px;
      }

      #stage {
        height: 58vh;
        min-height: 300px;
        flex: none;
      }

      #dock {
        border-left: 0;
        overflow: visible;
      }

      .presets {
        grid-template-columns: repeat(4, 1fr);
      }

      #status .hide-sm {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <header id="menubar">
      <div class="brand"><span class="brand-mark"></span>Pigment</div>
      <div id="menus" style="display:flex;gap:2px"></div>
      <div class="spacer"></div>
      <button class="home-link" id="lang-toggle" style="background:none;border:0;cursor:pointer"></button>
      <a class="home-link" href="../index.html">← Igarin</a>
    </header>

    <div id="main">
      <!-- ── Toolbox ── -->
      <aside id="toolbox">
        <div class="tools" id="tools">
          <button class="tool" data-tool="hand" data-i18n-title="tool.hand">
            <svg viewBox="0 0 24 24">
              <path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12M11 11.5V4a1.5 1.5 0 0 1 3 0v7.5M14 11.5V5.5a1.5 1.5 0 0 1 3 0V12M17 9.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-2.2a6 6 0 0 1-4.9-2.6L3.3 14a1.6 1.6 0 0 1 2.6-1.9L8 14.5" />
            </svg><span class="k">H</span></button>
          <button class="tool" data-tool="zoom" data-i18n-title="tool.zoom">
            <svg viewBox="0 0 24 24">
              <circle cx="10.5" cy="10.5" r="6.5" />
              <path d="M15.5 15.5 21 21M8 10.5h5M10.5 8v5" />
            </svg><span class="k">Z</span></button>
          <button class="tool" data-tool="crop" data-i18n-title="tool.crop">
            <svg viewBox="0 0 24 24">
              <path d="M6 2v14a2 2 0 0 0 2 2h14M18 22V8a2 2 0 0 0-2-2H2" />
            </svg><span class="k">C</span></button>
          <button class="tool" data-tool="brush" data-i18n-title="tool.brush">
            <svg viewBox="0 0 24 24">
              <path d="M18.4 2.6a2 2 0 0 1 2.9 2.9L11.5 15.3 8.7 12.5ZM7.6 13.9c-2 0-3.6 1.6-3.6 3.6 0 1.3-.7 2.1-1.7 2.6 1 .6 2.3.7 3.7.7a4.2 4.2 0 0 0 4.2-4.2" />
            </svg><span class="k">B</span></button>
          <button class="tool" data-tool="eraser" data-i18n-title="tool.eraser">
            <svg viewBox="0 0 24 24">
              <path d="M8 21h12M5.4 13.6l7.2-7.2a2 2 0 0 1 2.8 0l3.2 3.2a2 2 0 0 1 0 2.8L11 20H8.3l-2.9-2.9a2.4 2.4 0 0 1 0-3.5ZM9 10l5 5" />
            </svg><span class="k">E</span></button>
          <button class="tool" data-tool="pick" data-i18n-title="tool.pick">
            <svg viewBox="0 0 24 24">
              <path d="m2 22 1-1h3l9-9M3 21v-3l9-9M14.5 6.5l3-3a2.1 2.1 0 0 1 3 3l-3 3 1 1-2 2-5-5 2-2 1 1Z" />
            </svg><span class="k">I</span></button>
        </div>

        <div class="section-title" id="opt-title"></div>

        <div class="opt" data-opt="hand">
          <p class="hint" data-i18n="hint.hand"></p>
        </div>
        <div class="opt" data-opt="zoom">
          <p class="hint" data-i18n="hint.zoom"></p>
        </div>
        <div class="opt" data-opt="crop">
          <div class="field">
            <select id="crop-aspect" data-i18n-aria="crop.aspect">
              <option value="free" data-i18n="crop.free"></option>
              <option value="orig" data-i18n="crop.orig"></option>
              <option value="1:1" data-i18n="crop.square"></option>
              <option value="4:3">4 : 3</option>
              <option value="3:2">3 : 2</option>
              <option value="16:9">16 : 9</option>
              <option value="5:4">5 : 4</option>
              <option value="2:1">2 : 1</option>
              <option value="21:9">21 : 9</option>
            </select>
            <button class="btn" id="crop-swap" data-i18n-title="crop.swap" data-i18n-aria="crop.swap">⇄</button>
          </div>
          <div class="grid2">
            <div class="field"><label>X</label><input type="number" id="crop-x" min="0"></div>
            <div class="field"><label>Y</label><input type="number" id="crop-y" min="0"></div>
            <div class="field"><label>W</label><input type="number" id="crop-w" min="1"></div>
            <div class="field"><label>H</label><input type="number" id="crop-h" min="1"></div>
          </div>
          <label class="check"><input type="checkbox" id="crop-thirds" checked> <span data-i18n="crop.thirds"></span></label>
          <div class="btn-row">
            <button class="btn primary" id="crop-apply"><span data-i18n="crop.apply"></span> <span style="opacity:.6">⏎</span></button>
            <button class="btn" id="crop-reset" data-i18n="common.reset"></button>
          </div>
          <p class="hint" style="margin-top:10px" data-i18n="hint.crop"></p>
        </div>
        <div class="opt" data-opt="brush eraser">
          <div id="brush-color-row">
            <div class="field">
              <input type="color" id="brush-color" value="#ff4d6d" data-i18n-aria="brush.color">
              <div id="brush-swatches" style="display:flex;gap:4px;flex-wrap:wrap"></div>
            </div>
          </div>
          <div class="srow">
            <div class="srow-head"><span data-i18n="brush.size"></span><span class="v" id="brush-size-v"></span></div>
            <input type="range" id="brush-size" min="1" max="400" step="1" value="24">
          </div>
          <div class="srow">
            <div class="srow-head"><span data-i18n="brush.opacity"></span><span class="v" id="brush-opacity-v"></span></div>
            <input type="range" id="brush-opacity" min="1" max="100" step="1" value="100">
          </div>
          <div class="srow">
            <div class="srow-head"><span data-i18n="brush.hardness"></span><span class="v" id="brush-hardness-v"></span></div>
            <input type="range" id="brush-hardness" min="0" max="100" step="1" value="80">
          </div>
          <p class="hint" style="margin-top:8px" data-i18n="hint.brush"></p>
        </div>
        <div class="opt" data-opt="pick">
          <div class="field" style="gap:10px">
            <span class="swatch" id="pick-swatch" style="width:30px;height:30px;border-radius:6px"></span>
            <span id="pick-hex" style="font-family:var(--mono)">—</span>
          </div>
          <p class="hint" data-i18n="hint.pick"></p>
        </div>
      </aside>

      <!-- ── Stage ── -->
      <section id="stage">
        <canvas id="view"></canvas>
        <div id="empty">
          <div class="drop-hint">
            <h1>Pigment</h1>
            <p data-i18n="empty.lead"></p>
            <div class="btn-row">
              <button class="btn primary" data-action="open" data-i18n="empty.open"></button>
              <button class="btn" data-action="sample" data-i18n="empty.sample"></button>
            </div>
            <small data-i18n="empty.small"></small>
          </div>
        </div>
        <div id="compare-badge">BEFORE</div>
        <div id="busy">
          <div class="spinner"></div>
        </div>
      </section>

      <!-- ── Dock ── -->
      <aside id="dock">
        <details class="panel" open>
          <summary data-i18n="panel.hist"></summary>
          <div class="panel-body"><canvas id="hist"></canvas></div>
        </details>

        <details class="panel" open>
          <summary data-i18n="panel.curves"></summary>
          <div class="panel-body">
            <div class="seg" id="curve-ch">
              <button data-ch="rgb" class="active">RGB</button>
              <button data-ch="r">R</button>
              <button data-ch="g">G</button>
              <button data-ch="b">B</button>
            </div>
            <canvas id="curves"></canvas>
            <div class="curve-info"><span id="curve-io" data-i18n="curve.hint"></span><span data-i18n="curve.del"></span></div>
            <div class="btn-row">
              <button class="btn small" data-curve="linear" data-i18n="cp.linear"></button>
              <button class="btn small" data-curve="s" data-i18n="cp.s"></button>
              <button class="btn small" data-curve="fade" data-i18n="cp.fade"></button>
              <button class="btn small" data-curve="lift" data-i18n="cp.lift"></button>
              <button class="btn small" data-curve="invert" data-i18n="cp.invert"></button>
            </div>
          </div>
        </details>

        <details class="panel" open>
          <summary><span data-i18n="panel.adjust"></span><span class="sum-right"><button class="btn small" id="btn-auto" data-i18n="adj.autoBtn" data-i18n-title="h.auto"></button>
              <button class="btn small" id="btn-reset-adj" data-i18n="common.reset" data-i18n-title="h.resetAdj"></button></span></summary>
          <div class="panel-body">
            <div id="adjust-sliders"></div>
            <label class="check" style="margin-top:8px"><input type="checkbox" id="adj-invert"> <span data-i18n="adj.invertLabel"></span></label>
          </div>
        </details>

        <details class="panel">
          <summary data-i18n="panel.presets"></summary>
          <div class="panel-body">
            <div class="presets" id="presets"></div>
          </div>
        </details>

        <details class="panel">
          <summary data-i18n="panel.layers"></summary>
          <div class="panel-body">
            <div class="layer-row">
              <input type="checkbox" id="paint-visible" checked data-i18n-aria="layer.show">
              <span class="lname" data-i18n="layer.paint"></span><span class="ldim" id="paint-state"></span>
            </div>
            <div class="srow" style="padding:0 2px">
              <div class="srow-head"><span data-i18n="layer.opacity"></span><span class="v" id="paint-opacity-v">100%</span></div>
              <input type="range" id="paint-opacity" min="0" max="100" value="100">
            </div>
            <div class="layer-row" style="margin-top:6px">
              <span style="width:13px"></span><span class="lname" data-i18n="layer.bg"></span><span class="ldim" data-i18n="layer.bgNote"></span>
            </div>
            <button class="btn small" data-action="clear-paint" data-i18n="mi.clearPaint"></button>
          </div>
        </details>

        <details class="panel" open>
          <summary data-i18n="panel.history"></summary>
          <div class="panel-body">
            <ul id="history"></ul>
          </div>
        </details>
      </aside>
    </div>

    <footer id="status">
      <span id="st-doc"></span>
      <span id="st-pos" class="hide-sm"></span>
      <span id="st-col" class="hide-sm"></span>
      <div class="zoomctl">
        <button class="zbtn" id="btn-compare" data-i18n="zoom.compare" data-i18n-title="zoom.compareTitle"></button>
        <button class="zbtn" data-action="zoom-out" data-i18n-title="zoom.outTitle">−</button>
        <button class="zbtn" id="zoom-label" data-action="zoom-100" title="100%">100%</button>
        <button class="zbtn" data-action="zoom-in" data-i18n-title="zoom.inTitle">＋</button>
        <button class="zbtn" data-action="zoom-fit" data-i18n-title="zoom.fitTitle">Fit</button>
      </div>
    </footer>
  </div>

  <div id="modal"></div>
  <div id="toast"></div>
  <input type="file" id="file" accept="image/*" hidden>

    /* curves editor */

    function drawCurves() {

      if (cv.width !== Math.round(size * d)) { cv.width = cv.height = Math.round(size * d); }
      const c = ctx2d(cv); c.setTransform(d, 0, 0, d, 0, 0); c.clearRect(0, 0, size, size);
      const X = v => CPAD + v / 255 * inner, Y = v => CPAD + (1 - v / 255) * inner;

        const arr = curveCh === 'rgb' ? srcHist.l : srcHist[curveCh];
        let max = 1; for (let i = 1; i < 255; i++) max = Math.max(max, arr[i]);
        c.beginPath(); c.moveTo(X(0), Y(0));

          $('#ex-q', m).oninput = () => $('#ex-q-v').textContent = $('#ex-q').value;
          info();
        },
        onOk: () => {
          const name = $('#ex-name').value.trim().replace(/[\\/:*?"<>|]/g, '_'), fmt = $('#ex-fmt').value, q = +$('#ex-q').value / 100, s = +$('#ex-s').value;
          withBusy(() => exportImage(name, fmt, q, s)).catch(() => toast(t('toast.exportFail')));
        }
      });
    }
    function dlgHelp() {
      const rows = [
        ['hk.open', 'Ctrl+O / Ctrl+V'], ['hk.export', 'Ctrl+S'], ['hk.undo', 'Ctrl+Z / Ctrl+Shift+Z'],
        ['hk.tools1', 'H / Z / C'], ['hk.tools2', 'B / E / I'],
        ['hk.pan', t('key.spaceDrag')], ['hk.zoom', t('key.zoom')], ['hk.fit', 'Ctrl+0 / Ctrl+1'],
        ['hk.crop', 'Enter / Esc'], ['hk.rot', 'R / Shift+R'], ['hk.brush', '[ / ]'],
        ['hk.compare', '\\'], ['hk.dock', 'Tab'], ['hk.reset', t('key.dbl')],
      ];
      openDialog({
        title: t('help.title'), ok: null, cancel: t('dlg.close'),
        body: `<table class="help-table">${rows.map(r => `<tr><td>${t(r[0])}</td><td>${r[1].split(' / ').map(k => `<kbd>${k}</kbd>`).join(' / ')}</td></tr>`).join('')}</table>
               <p class="note" style="margin-top:12px">${t('help.note')}</p>`
      });
    }

    /* ════════════════════════════════════════════════════════════
       Menus & actions
       ════════════════════════════════════════════════════════════ */
    const ACTIONS = {
      open: () => $('#file').click(),
      sample: makeSample,
      export: dlgExport,
      copy: copyImage,
      undo, redo,
      'reset-adjust': resetAdjust,
      'clear-paint': () => { if (!doc.paint) return; doc.paint = null; updatePaintState(); snapshot('h.clearPaint'); requestRender(); },
      crop: () => setTool('crop'),
      resize: dlgResize,
      'rot-cw': () => doc.base && rotate90(1),
      'rot-ccw': () => doc.base && rotate90(-1),
      rotate: dlgRotate,
      'flip-h': () => doc.base && flip(true),
      'flip-v': () => doc.base && flip(false),
      auto: autoTone,
      'desaturate': () => { if (!doc.base) return; adjust.saturation = -100; adjustChanged(); syncAdjustUI(); snapshot('h.desat'); },
      'invert': () => { if (!doc.base) return; adjust.invert = !adjust.invert; adjustChanged(); syncAdjustUI(); snapshot('h.invert'); },
      'f-pixelate': dlgPixelate,
      'f-emboss': () => filterBase('h.emboss', FILTERS.emboss),
      'f-edge': () => filterBase('h.edge', FILTERS.edge),
      'f-median': () => filterBase('h.median', FILTERS.median),
      'zoom-in': () => zoomStep(1),
      'zoom-out': () => zoomStep(-1),
      'zoom-fit': () => zoomFit(false),
      'zoom-100': () => setZoom(1),
      'toggle-dock': () => { $('#main').classList.toggle('dock-hidden'); },
      help: dlgHelp,
    };
    const MENUS = [
      ['m.file', [['open', 'mi.open', 'Ctrl+O'], ['sample', 'mi.sample'], '-', ['export', 'mi.export', 'Ctrl+S'], ['copy', 'mi.copy', 'Ctrl+Shift+C']]],
      ['m.edit', [['undo', 'mi.undo', 'Ctrl+Z'], ['redo', 'mi.redo', 'Ctrl+Shift+Z'], '-', ['reset-adjust', 'mi.resetAdj'], ['clear-paint', 'mi.clearPaint']]],
      ['m.image', [['crop', 'mi.crop', 'C'], ['resize', 'mi.resize'], '-', ['rot-cw', 'mi.rotCw', 'R'], ['rot-ccw', 'mi.rotCcw', 'Shift+R'], ['rotate', 'mi.rotate'], '-', ['flip-h', 'mi.flipH'], ['flip-v', 'mi.flipV']]],
      ['m.color', [['auto', 'mi.auto'], ['desaturate', 'mi.desat'], ['invert', 'mi.invert']]],
      ['m.filters', [['f-pixelate', 'mi.pixelate'], ['f-emboss', 'mi.emboss'], ['f-edge', 'mi.edge'], ['f-median', 'mi.median']]],
      ['m.view', [['zoom-in', 'mi.zoomIn', '+'], ['zoom-out', 'mi.zoomOut', '−'], ['zoom-fit', 'mi.fit', 'Ctrl+0'], ['zoom-100', 'mi.100', 'Ctrl+1'], '-', ['toggle-dock', 'mi.dock', 'Tab']]],
      ['m.help', [['help', 'mi.help', '?']]],
    ];
    const NEEDS_DOC = new Set(['export', 'copy', 'reset-adjust', 'clear-paint', 'crop', 'resize', 'rot-cw', 'rot-ccw', 'rotate', 'flip-h', 'flip-v', 'auto', 'desaturate', 'invert', 'f-pixelate', 'f-emboss', 'f-edge', 'f-median', 'zoom-in', 'zoom-out', 'zoom-fit', 'zoom-100']);
    let openMenu = null;
    function buildMenus() {
      closeMenus();
      const host = $('#menus'); host.innerHTML = '';
      $$('body > .menu-drop').forEach(d => d.remove());
      for (const [name, items] of MENUS) {
        const btn = document.createElement('button'); btn.className = 'menu-btn'; btn.textContent = t(name);
        const drop = document.createElement('div'); drop.className = 'menu-drop';
        for (const it of items) {
          if (it === '-') { drop.appendChild(Object.assign(document.createElement('div'), { className: 'menu-sep' })); continue; }
          const [act, label, key] = it;
          const b = document.createElement('button'); b.className = 'menu-item'; b.dataset.act = act;
          b.innerHTML = `<span></span>${key ? `<kbd>${key}</kbd>` : ''}`; b.firstChild.textContent = t(label);
          b.onclick = () => { closeMenus(); ACTIONS[act](); };
          drop.appendChild(b);
        }
        document.body.appendChild(drop);
        const show = () => {
          closeMenus(); openMenu = { btn, drop }; btn.classList.add('open');
          drop.querySelectorAll('.menu-item').forEach(b => {
            const a = b.dataset.act;
            const dis = (NEEDS_DOC.has(a) && !doc.base) || (a === 'undo' && hIndex <= 0) || (a === 'redo' && hIndex >= history.length - 1) || (a === 'clear-paint' && !doc.paint);
            b.classList.toggle('disabled', dis);
          });
          const r = btn.getBoundingClientRect();
          drop.classList.add('open');
          drop.style.left = Math.max(4, Math.min(r.left, innerWidth - drop.offsetWidth - 4)) + 'px'; drop.style.top = (r.bottom + 2) + 'px';
        };
        btn.addEventListener('click', e => { e.stopPropagation(); if (openMenu && openMenu.btn === btn) closeMenus(); else show(); });
        btn.addEventListener('mouseenter', () => { if (openMenu && openMenu.btn !== btn) show(); });
        host.appendChild(btn);
      }
    }
    document.addEventListener('pointerdown', e => { if (openMenu && !openMenu.drop.contains(e.target) && !openMenu.btn.contains(e.target)) closeMenus(); });

    function applyI18n() {
      document.documentElement.lang = lang;
      document.title = t('meta.title');
      $('meta[name=description]').content = t('meta.desc');
      $$('[data-i18n]').forEach(el => el.innerHTML = t(el.dataset.i18n));
      $$('[data-i18n-title]').forEach(el => el.title = t(el.dataset.i18nTitle));
      $$('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', t(el.dataset.i18nAria)));
      $('#lang-toggle').textContent = t('lang.switch');
      $('#lang-toggle').lang = lang === 'ja' ? 'en' : 'ja';
      buildMenus();
      for (const k in sliderEls) refreshSlider(k);
      $('#opt-title').textContent = t('tn.' + tool);
      updateDocStatus(); updatePaintState(); renderHistory();
    }
    function toggleLang() {
      lang = lang === 'ja' ? 'en' : 'ja';
      const u = new URL(location.href);
      if (lang === 'ja') u.searchParams.set('lang', 'ja'); else u.searchParams.delete('lang');
      try { window.history.replaceState(null, '', u); } catch (e) { }
      applyI18n();
    }
    function closeMenus() { if (!openMenu) return; openMenu.btn.classList.remove('open'); openMenu.drop.classList.remove('open'); openMenu = null; }

    /* ════════════════════════════════════════════════════════════
       Keyboard
       ════════════════════════════════════════════════════════════ */
    function setCompare(on) {
      if (!doc.base) on = false;
      if (compare === on) return;
      compare = on; $('#compare-badge').classList.toggle('show', on); $('#btn-compare').classList.toggle('active', on); requestRender();
    }
    document.addEventListener('keydown', e => {
      const ae = document.activeElement;
      const typing = ae && (ae.tagName === 'TEXTAREA' || ae.tagName === 'SELECT' || (ae.tagName === 'INPUT' && !['range', 'checkbox', 'color'].includes(ae.type)));
      if (e.key === 'Escape') {
        if (modalState) closeDialog(false);
        else if (openMenu) closeMenus();
        else if (tool === 'crop' && doc.base) cropInit();
        return;
      }
      if (modalState) { if (e.key === 'Enter' && !(ae && ae.tagName === 'BUTTON')) { e.preventDefault(); closeDialog(true); } return; }
      if (typing) return;
      const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
      if (mod) {
        let handled = true;
        if (k === 'z') e.shiftKey ? redo() : undo();
        else if (k === 'y') redo();
        else if (k === 'o') ACTIONS.open();
        else if (k === 's') dlgExport();
        else if (k === '0') zoomFit(false);
        else if (k === '1') setZoom(1);
        else if ((k === '=' || k === '+') && doc.base) zoomStep(1);
        else if (k === '-' && doc.base) zoomStep(-1);
        else if (k === 'c' && e.shiftKey) copyImage();
        else handled = false;
        if (handled) e.preventDefault();
        return;
      }
      if (e.altKey) return;
      switch (e.key) {
        case 'h': case 'H': setTool('hand'); break;
        case 'z': case 'Z': setTool('zoom'); break;
        case 'c': case 'C': setTool('crop'); break;
        case 'b': case 'B': setTool('brush'); break;
        case 'e': case 'E': setTool('eraser'); break;
        case 'i': case 'I': setTool('pick'); break;
        case 'r': if (doc.base) rotate90(1); break;
        case 'R': if (doc.base) rotate90(-1); break;
        case '+': case '=': zoomStep(1); break;
        case '-': case '_': zoomStep(-1); break;
        case '[': setBrushSize(brush.size - Math.max(1, Math.round(brush.size * 0.15))); break;
        case ']': setBrushSize(brush.size + Math.max(1, Math.round(brush.size * 0.15))); break;
        case '\\': setCompare(true); break;
        case '?': dlgHelp(); break;
        case 'Tab': e.preventDefault(); ACTIONS['toggle-dock'](); break;
        case 'Enter': if (tool === 'crop') { e.preventDefault(); applyCrop(); } break;
        case ' ':
          if (ae && ae.tagName === 'BUTTON') return;
          e.preventDefault(); if (!spaceDown) { spaceDown = true; updateCursor(); requestRender(); } break;
        default: return;
      }
    });
    document.addEventListener('keyup', e => {
      if (e.key === '\\') setCompare(false);
      if (e.key === ' ') { spaceDown = false; updateCursor(hover); requestRender(); }
    });
    window.addEventListener('blur', () => { spaceDown = false; setCompare(false); });

    /* ════════════════════════════════════════════════════════════
       Wire up UI
       ════════════════════════════════════════════════════════════ */
    function setBrushSize(v) { brush.size = clamp(Math.round(v), 1, 400); $('#brush-size').value = brush.size; $('#brush-size-v').textContent = brush.size + ' px'; requestRender(); }
    function initUI() {
      buildSliders(); buildPresetButtons(); setupCurves(); applyI18n();
      $('#lang-toggle').onclick = toggleLang;
      $$('.tool').forEach(b => b.onclick = () => setTool(b.dataset.tool));
      $$('[data-action]').forEach(b => b.addEventListener('click', () => ACTIONS[b.dataset.action]()));
      $('#btn-auto').onclick = e => { e.preventDefault(); autoTone(); };
      $('#btn-reset-adj').onclick = e => { e.preventDefault(); resetAdjust(); };
      $('#adj-invert').onchange = e => { if (!doc.base) { e.target.checked = false; return; } adjust.invert = e.target.checked; adjustChanged(); snapshot('h.invert'); };

      // crop
      $('#crop-aspect').onchange = () => { if (doc.base) cropInit(); };
      $('#crop-swap').onclick = () => { cropSwap = !cropSwap; if (doc.base) cropInit(); };
      ['x', 'y', 'w', 'h'].forEach(k => $('#crop-' + k).addEventListener('change', () => cropFromInputs(k)));
      $('#crop-thirds').onchange = e => { cropThirds = e.target.checked; requestRender(); };
      $('#crop-apply').onclick = applyCrop;
      $('#crop-reset').onclick = () => doc.base && cropInit();

      // brush
      const sw = $('#brush-swatches');
      ['#ffffff', '#000000', '#ff4d6d', '#ffd23d', '#4fd18b', '#4fa3ff', '#b06cf0'].forEach(col => {
        const b = document.createElement('button'); b.className = 'swatch'; b.style.cssText = `background:${col};width:18px;height:18px;cursor:pointer;margin:0`;
        b.title = col; b.onclick = () => setBrushColor(col); sw.appendChild(b);
      });
      $('#brush-color').oninput = e => brush.color = e.target.value;
      $('#brush-size').oninput = e => setBrushSize(+e.target.value);
      $('#brush-opacity').oninput = e => { brush.opacity = e.target.value / 100; $('#brush-opacity-v').textContent = e.target.value + '%'; };
      $('#brush-hardness').oninput = e => { brush.hardness = e.target.value / 100; $('#brush-hardness-v').textContent = e.target.value + '%'; };
      setBrushSize(brush.size); $('#brush-opacity-v').textContent = '100%'; $('#brush-hardness-v').textContent = '80%';

      // layers
      $('#paint-visible').onchange = e => { layer.paintVisible = e.target.checked; requestRender(); };
      $('#paint-opacity').oninput = e => { layer.paintOpacity = e.target.value / 100; $('#paint-opacity-v').textContent = e.target.value + '%'; requestRender(); };

      // compare (press & hold)
      const cb = $('#btn-compare');
      cb.addEventListener('pointerdown', () => setCompare(true));
      ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => cb.addEventListener(t, () => setCompare(false)));

      // redraw small canvases when panels open / dock resizes
      $$('#dock details').forEach(d => d.addEventListener('toggle', () => { drawHistogram(); drawCurves(); }));
      new ResizeObserver(() => { drawHistogram(); drawCurves(); }).observe($('#dock'));

      window.addEventListener('beforeunload', e => { if (hIndex > 0) { e.preventDefault(); e.returnValue = ''; } });

      setTool('hand'); syncAdjustUI(); renderHistory(); resizeView();
    }
    initUI();
  </script>
</body>

</html>
