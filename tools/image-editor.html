<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Pigment — Image editor in your browser</title>
  <meta name="description"
    content="Pigment is an image editor that runs entirely in your browser: TIFF, DNG RAW and FITS files, curves, selection, fill, crop, saturation, exposure, white balance, sharpen, vignette, brush, rotate and more. Your images are never uploaded.">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #18191c;
      --stage: #26272b;
      --panel: #202125;
      --panel-2: #2a2b30;
      --panel-3: #33343a;
      --line: #36373d;
      --line-2: #46474e;
      --text: #e6e6e9;
      --dim: #9b9ca5;
      --faint: #6d6e76;
      --accent: #f0a640;
      --accent-2: #ffc46b;
      --on-accent: #1b1205;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
      color-scheme: dark;
    }

    html,
    body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font: 13px/1.45 var(--sans);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -webkit-user-select: none;
      user-select: none;
    }

    button {
      font: inherit;
      color: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }

    /* ─── Menubar ─────────────────────────────── */
    #menubar {
      height: 38px;
      flex: none;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 0 8px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }

    #menus {
      display: flex;
      gap: 2px;
      min-width: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }

    #menus::-webkit-scrollbar,
    #optbar::-webkit-scrollbar {
      display: none;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 2px;
      flex: none;
      margin-left: 8px;
    }

    .icon-btn {
      width: 30px;
      height: 28px;
      display: grid;
      place-items: center;
      background: none;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      color: var(--text);
    }

    .icon-btn:hover {
      background: var(--panel-3);
    }

    .icon-btn:disabled {
      opacity: .32;
      pointer-events: none;
    }

    .icon-btn svg,
    .ico {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    #btn-export {
      margin-left: 6px;
      padding: 5px 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      letter-spacing: .02em;
      margin-right: 10px;
      white-space: nowrap;
    }

    .brand-mark {
      width: 18px;
      height: 18px;
      border-radius: 5px;
      background: conic-gradient(from 200deg, #f0a640, #ef6461, #b06cf0, #4fa3ff, #4fd18b, #f0a640);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .15);
    }

    .menu-btn {
      background: none;
      border: 0;
      padding: 5px 9px;
      border-radius: 5px;
      cursor: pointer;
      white-space: nowrap;
    }

    .menu-btn:hover,
    .menu-btn.open {
      background: var(--panel-3);
    }

    .menu-drop {
      position: fixed;
      min-width: 230px;
      background: #2b2c31;
      border: 1px solid var(--line-2);
      border-radius: 8px;
      padding: 5px;
      box-shadow: 0 14px 40px rgba(0, 0, 0, .55);
      z-index: 100;
      display: none;
    }

    .menu-drop.open {
      display: block;
    }

    .menu-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
      width: 100%;
      background: none;
      border: 0;
      padding: 6px 10px;
      border-radius: 5px;
      cursor: pointer;
      text-align: left;
    }

    .menu-item:hover {
      background: var(--accent);
      color: var(--on-accent);
    }

    .menu-item kbd {
      font: 11px var(--mono);
      color: var(--dim);
    }

    .menu-item:hover kbd {
      color: inherit;
      opacity: .75;
    }

    .menu-item.disabled {
      opacity: .38;
      pointer-events: none;
    }

    .menu-sep {
      height: 1px;
      background: var(--line);
      margin: 4px 6px;
    }

    .spacer {
      flex: 1;
    }

    .home-link {
      color: var(--dim);
      text-decoration: none;
      font-size: 12px;
      padding: 5px 8px;
      border-radius: 5px;
      white-space: nowrap;
    }

    .home-link:hover {
      color: var(--text);
      background: var(--panel-3);
    }

    /* ─── Options bar (contextual, like Photoshop) ─── */
    #optbar {
      height: 42px;
      flex: none;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      overflow-x: auto;
      scrollbar-width: none;
      white-space: nowrap;
    }

    .ob-tool {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      flex: none;
      padding-right: 12px;
      border-right: 1px solid var(--line);
      height: 24px;
    }

    .ob-tool svg {
      width: 17px;
      height: 17px;
      fill: none;
      stroke: var(--accent);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .opt {
      display: none;
    }

    .opt.show {
      display: flex;
      align-items: center;
      gap: 10px 14px;
      min-width: 0;
      flex: 1;
    }

    .ob-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: none;
    }

    .ob-sep {
      width: 1px;
      height: 22px;
      background: var(--line);
      flex: none;
    }

    .ob-label {
      color: var(--dim);
      font-size: 12px;
    }

    .ob-slider input[type=range] {
      width: 110px;
    }

    .ob-val {
      font: 11px var(--mono);
      color: var(--text);
      min-width: 42px;
    }

    .ob-num {
      width: 66px !important;
    }

    .ob-hint {
      color: var(--faint);
      font-size: 12px;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ob-hint kbd {
      font: 11px var(--mono);
      background: var(--panel-3);
      border: 1px solid var(--line-2);
      border-radius: 4px;
      padding: 0 4px;
      color: var(--dim);
    }

    #optbar .check {
      margin: 0;
    }

    .ob-seg {
      margin: 0;
      flex: none;
    }

    .seg.ob-seg button {
      padding: 4px 12px;
      flex: none;
    }

    .swatches {
      display: flex;
      gap: 4px;
    }

    .swatches button {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      border: 1px solid var(--line-2);
      cursor: pointer;
      padding: 0;
    }

    /* ─── Main grid ───────────────────────────── */
    #main {
      flex: 1;
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) 304px;
      min-height: 0;
    }

    #app.chrome-hidden #dock,
    #app.chrome-hidden #toolstrip,
    #app.chrome-hidden #optbar {
      display: none;
    }

    #app.chrome-hidden #main {
      grid-template-columns: minmax(0, 1fr);
    }

    /* ─── Tool rail ───────────────────────────── */
    #toolstrip {
      background: var(--panel);
      border-right: 1px solid var(--line);
      overflow-y: auto;
      scrollbar-width: none;
      padding: 8px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .tools {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .tool-sep {
      height: 1px;
      width: 22px;
      background: var(--line);
      margin: 3px auto;
    }

    .tool {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      background: none;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      color: var(--dim);
    }

    .tool svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .tool:hover {
      background: var(--panel-3);
      color: var(--text);
    }

    .tool.active {
      background: var(--accent);
      color: var(--on-accent);
    }

    /* foreground / background chips */
    .colors {
      position: relative;
      width: 38px;
      height: 38px;
      flex: none;
    }

    .colors input[type=color] {
      position: absolute;
      width: 24px;
      height: 24px;
      padding: 0;
      border: 2px solid #f2f2f4;
      border-radius: 5px;
      box-shadow: 0 0 0 1px #000;
      -webkit-appearance: none;
      appearance: none;
      background: none;
      cursor: pointer;
    }

    .colors input[type=color]::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    .colors input[type=color]::-webkit-color-swatch {
      border: 0;
      border-radius: 3px;
    }

    .colors input[type=color]::-moz-color-swatch {
      border: 0;
      border-radius: 3px;
    }

    #fg-color {
      left: 0;
      top: 0;
      z-index: 1;
    }

    #bg-color {
      right: 0;
      bottom: 0;
    }

    .chip-btn {
      position: absolute;
      width: 13px;
      height: 13px;
      padding: 0;
      background: none;
      border: 0;
      cursor: pointer;
      color: var(--dim);
      display: grid;
      place-items: center;
    }

    .chip-btn:hover {
      color: var(--text);
    }

    .chip-btn svg {
      width: 11px;
      height: 11px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    #swap-colors {
      right: -1px;
      top: -1px;
    }

    #reset-colors {
      left: -1px;
      bottom: -1px;
    }

    .hint {
      color: var(--dim);
      font-size: 12px;
      line-height: 1.6;
    }

    .hint kbd,
    .help-table kbd {
      font: 11px var(--mono);
      background: var(--panel-3);
      border: 1px solid var(--line-2);
      border-radius: 4px;
      padding: 0 4px;
      color: var(--text);
    }

    .btn {
      background: var(--panel-3);
      border: 1px solid var(--line-2);
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn:hover {
      background: #3e3f46;
    }

    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--on-accent);
      font-weight: 600;
    }

    .btn.primary:hover {
      background: var(--accent-2);
    }

    .btn.small {
      padding: 3px 8px;
      font-size: 11px;
    }

    .btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--on-accent);
    }

    .btn-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .field {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 7px;
    }

    .field>label {
      color: var(--dim);
      font-size: 12px;
      min-width: 14px;
    }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 8px;
    }

    input[type=number],
    input[type=text],
    select {
      background: #16171a;
      border: 1px solid var(--line-2);
      color: var(--text);
      font: 12px var(--mono);
      padding: 5px 7px;
      border-radius: 5px;
      width: 100%;
      min-width: 0;
      -webkit-user-select: text;
      user-select: text;
    }

    select {
      font-family: var(--sans);
    }

    input:focus-visible,
    select:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    input[type=color] {
      width: 38px;
      height: 30px;
      border: 1px solid var(--line-2);
      border-radius: 6px;
      background: #16171a;
      padding: 2px;
      cursor: pointer;
    }

    .check {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: var(--dim);
      margin: 6px 0 10px;
      cursor: pointer;
    }

    .check input {
      accent-color: var(--accent);
    }

    /* range */
    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 18px;
      background: transparent;
      cursor: pointer;
      --track: linear-gradient(var(--line-2), var(--line-2));
    }

    input[type=range]::-webkit-slider-runnable-track {
      height: 4px;
      border-radius: 2px;
      background: var(--track);
    }

    input[type=range]::-moz-range-track {
      height: 4px;
      border-radius: 2px;
      background: var(--track);
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #f2f2f4;
      border: 2px solid #16171a;
      margin-top: -5px;
      box-shadow: 0 0 0 1px var(--line-2);
    }

    input[type=range]::-moz-range-thumb {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #f2f2f4;
      border: 2px solid #16171a;
    }

    input[type=range]:active::-webkit-slider-thumb {
      background: var(--accent);
    }

    input[type=range]:active::-moz-range-thumb {
      background: var(--accent);
    }

    .r-temp {
      --track: linear-gradient(90deg, #4f8fff, #cfcfcf, #ffb13d) !important;
    }

    .r-tint {
      --track: linear-gradient(90deg, #3fc46a, #cfcfcf, #e05ad6) !important;
    }

    .r-sat {
      --track: linear-gradient(90deg, #7a7a7a, #ff3d6e) !important;
    }

    .r-hue {
      --track: linear-gradient(90deg, #00e5ff, #3d5bff, #e040fb, #ff3d3d, #ffd23d, #3dff6e, #00e5ff) !important;
    }

    .r-exp {
      --track: linear-gradient(90deg, #111, #eee) !important;
    }

    /* ─── Stage ───────────────────────────────── */
    #stage {
      position: relative;
      background: var(--stage);
      overflow: hidden;
      min-width: 0;
      min-height: 0;
      touch-action: none;
    }

    #view {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #empty {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    #empty.hidden {
      display: none;
    }

    .drop-hint {
      border: 1.5px dashed var(--line-2);
      border-radius: 18px;
      padding: 36px 34px;
      max-width: 440px;
      text-align: center;
      background: rgba(0, 0, 0, .12);
    }

    .drop-hint h1 {
      font-size: 22px;
      letter-spacing: .01em;
      margin-bottom: 6px;
    }

    .drop-hint p {
      color: var(--dim);
      margin-bottom: 18px;
    }

    .drop-hint .btn-row {
      justify-content: center;
    }

    .drop-hint .btn {
      padding: 9px 16px;
      font-size: 13px;
    }

    .drop-hint small {
      display: block;
      color: var(--faint);
      margin-top: 16px;
      font-size: 11px;
    }

    #stage.dragover::after {
      content: '';
      position: absolute;
      inset: 10px;
      border: 2px dashed var(--accent);
      border-radius: 12px;
      background: rgba(240, 166, 64, .07);
      pointer-events: none;
    }

    #compare-badge {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, .65);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      letter-spacing: .06em;
      display: none;
      pointer-events: none;
    }

    #compare-badge.show {
      display: block;
    }

    #busy {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(20, 20, 24, .35);
      z-index: 5;
    }

    #busy.show {
      display: flex;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, .15);
      border-top-color: var(--accent);
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ─── Dock ────────────────────────────────── */
    #dock {
      background: var(--panel);
      border-left: 1px solid var(--line);
      overflow-y: auto;
    }

    .panel {
      border-bottom: 1px solid var(--line);
    }

    .panel>summary {
      list-style: none;
      cursor: pointer;
      padding: 10px 12px;
      font-size: 12px;
      color: var(--text);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .panel>summary::-webkit-details-marker {
      display: none;
    }

    .panel>summary::before {
      content: '';
      border-left: 4px solid currentColor;
      border-top: 4px solid transparent;
      border-bottom: 4px solid transparent;
      transition: transform .15s;
    }

    .panel[open]>summary::before {
      transform: rotate(90deg);
    }

    .panel>summary::before {
      color: var(--faint);
    }

    .panel>summary .sum-right {
      margin-left: auto;
      font-weight: 400;
      display: flex;
      gap: 4px;
    }

    .panel-body {
      padding: 2px 12px 14px;
    }

    #hist {
      width: 100%;
      height: 92px;
      display: block;
      border-radius: 6px;
      background: #141518;
    }

    .seg {
      display: flex;
      background: #16171a;
      border: 1px solid var(--line-2);
      border-radius: 6px;
      padding: 2px;
      gap: 2px;
      margin-bottom: 8px;
    }

    .seg button {
      flex: 1;
      background: none;
      border: 0;
      padding: 4px 0;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      color: var(--dim);
    }

    .seg button.active {
      background: var(--panel-3);
      color: var(--text);
    }

    .seg button[data-ch=r].active {
      color: #ff7676;
    }

    .seg button[data-ch=g].active {
      color: #5fe09a;
    }

    .seg button[data-ch=b].active {
      color: #6fb4ff;
    }

    #curves {
      width: 100%;
      aspect-ratio: 1;
      display: block;
      border-radius: 6px;
      background: #141518;
      touch-action: none;
      cursor: crosshair;
    }

    .curve-info {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 2px 10px;
      font-size: 11.5px;
      font-variant-numeric: tabular-nums;
      color: var(--dim);
      margin: 6px 0 8px;
      min-height: 15px;
    }

    .curve-edit {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
    }

    .curve-edit label {
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--dim);
      font-size: 12px;
    }

    .curve-edit input {
      width: 52px;
    }

    .curve-edit input:disabled {
      opacity: .45;
    }

    #cv-del {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    #cv-del svg {
      width: 13px;
      height: 13px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    #cv-del:not(:disabled):hover {
      background: #5a2a2c;
      border-color: #8a3d40;
    }

    .btn:disabled {
      opacity: .4;
      pointer-events: none;
    }

    #curves:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .sgroup-title {
      font-size: 11px;
      color: var(--faint);
      margin: 12px 0 4px;
      letter-spacing: .04em;
    }

    .sgroup-title:first-child {
      margin-top: 2px;
    }

    .srow {
      margin-bottom: 4px;
    }

    .srow-head {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--dim);
      cursor: default;
    }

    .srow-head .v {
      font: 11px var(--mono);
      color: var(--text);
    }

    .srow.changed .srow-head span:first-child {
      color: var(--accent-2);
    }

    .layer-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      background: var(--panel-2);
      border: 1px solid var(--line);

    html[data-theme=xp] .seg button {

    html[data-theme=xp] .seg button.active {

    /* toolbox (like Paint's) */

      background: #ece9d8;

      box-shadow: inset -1px 0 0 #fff;
    }

    }

    html[data-theme=xp] .chip-btn {

    }

    /* workspace */
    html[data-theme=xp] #stage {
      background: #8c8c8c;
    }

    html[data-theme=xp] .drop-hint {
      background: #fff;
      border: 1px solid #7f9db9;
      border-radius: 0;
      box-shadow: 3px 3px 0 rgba(0, 0, 0, .25);

    html[data-theme=xp] .drop-hint h1 {

    /* task pane (the blue side panel from Explorer) */

    html[data-theme=xp] .srow-head,
    html[data-theme=xp] .hint {

    }

    html[data-theme=xp] .srow-head .v {
      color: #215dc6;
    }

    html[data-theme=xp] .srow.changed .srow-head span:first-child {

    }

    html[data-theme=xp] .sgroup-title {

      font-weight: bold;
      border-bottom: 1px solid #fff;
      padding-bottom: 2px;
    }

    html[data-theme=xp] .layer-row {
      background: #fff;
      border: 1px solid #7f9db9;
      border-radius: 0;
    }

    html[data-theme=xp] .layer-row .ldim {
      color: #555;
    }

    html[data-theme=xp] #history {
      background: #fff;
      border: 1px solid #7f9db9;
    }

    html[data-theme=xp] #history li button {
      border-radius: 0;

    }

    html[data-theme=xp] #history li button:hover {
      background: #c1d2ee;
    }

    html[data-theme=xp] #history li.current button {
      background: #316ac5;
      color: #fff;
    }

    html[data-theme=xp] #history li.current .n {
      color: #dfe8f7;
    }

    html[data-theme=xp] #history li.future button {
      color: #8d8a7c;
    }

    html[data-theme=xp] #cv-del:not(:disabled):hover {
      background: linear-gradient(180deg, #fff, #f7d6d2);
      border-color: #a3271c;
    }

    /* status bar */
    html[data-theme=xp] #status {
      background: #ece9d8;
      border-top: 1px solid #fff;
      box-shadow: 0 -1px 0 #aca899;
      color: #000;
      height: 24px;
      gap: 3px;
      padding: 0 3px;
    }

    html[data-theme=xp] #status>span:not(:empty) {
      border: 1px solid;
      border-color: #aca899 #fff #fff #aca899;
      padding: 1px 6px;
    }

    html[data-theme=xp] .zbtn {
      color: #000;
      border: 1px solid transparent;
      border-radius: 2px;
    }

    html[data-theme=xp] .zbtn:hover {
      background: #c1d2ee;
      border-color: #316ac5;
    }

    html[data-theme=xp] .zbtn.active {
      background: #98b5e2;
      color: #000;
      border-color: #316ac5;
    }

    /* dialogs → XP windows */
    html[data-theme=xp] #modal {
      background: rgba(0, 0, 0, .25);
    }

    html[data-theme=xp] .dialog {
      background: #ece9d8;
      color: #000;
      border: 3px solid #0055ea;
      border-top: 0;
      border-radius: 8px 8px 0 0;
      box-shadow: 4px 4px 10px rgba(0, 0, 0, .45);
    }

    html[data-theme=xp] .dlg-head {
      background: linear-gradient(180deg, #0997ff 0%, #0053ee 9%, #0050ee 40%, #0066ff 86%, #005bff 93%, #003dd7 100%);

      border-bottom: 0;
      position: sticky;
      top: 0;
      z-index: 2;
      margin: 0 -3px;
      padding-right: 6px;
    }

    html[data-theme=xp] .dialog h2 {
      color: #fff;
      font: bold 13px Trebuchet MS, Tahoma, sans-serif;
      text-shadow: 1px 1px 0 #0b2b80;
      padding: 7px 10px;
    }

    html[data-theme=xp] .dlg-x {
      display: grid;
      place-items: center;
      width: 21px;
      height: 21px;
      border: 1px solid #fff;
      border-radius: 3px;
      background: radial-gradient(circle at 30% 30%, #f6a58d, #e04343 55%, #c22a1f);
      color: #fff;
      font: bold 15px/1 Tahoma, sans-serif;
      cursor: pointer;
      padding: 0;
    }

    html[data-theme=xp] .dlg-x:hover {
      background: radial-gradient(circle at 30% 30%, #fbc3b0, #ef5b4b 55%, #d33a2c);
    }

    html[data-theme=xp] .dialog .foot {
      border-top: 0;
    }

    html[data-theme=xp] .dialog .note,
    html[data-theme=xp] .dev-info {
      color: #333;
    }

    html[data-theme=xp] .help-table td {
      border-bottom: 1px solid #d4d0c8;
    }

    html[data-theme=xp] #dev-cv,
    html[data-theme=xp] #dev-hist {
      background: #fff;
      border: 1px solid #7f9db9;
      border-radius: 0;
    }

    /* notification balloon */
    html[data-theme=xp] #toast {
      background: #ffffe1;
      color: #000;
      border: 1px solid #000;
      border-radius: 8px;
      box-shadow: 2px 2px 4px rgba(0, 0, 0, .35);
    }

    html[data-theme=xp] .spinner {
      border-color: rgba(0, 0, 0, .15);
      border-top-color: #316ac5;
    }

    /* phones */
    html[data-theme=xp] #mtabs {
      background: linear-gradient(180deg, #fefefe 0%, #ece9d8 100%);
      border-top: 1px solid #aca899;
    }

    html[data-theme=xp] #mtabs button {
      color: #333;
    }

    html[data-theme=xp] #mtabs button.active {
      color: #215dc6;
      font-weight: bold;
    }

    html[data-theme=xp] .fab {
      background: linear-gradient(180deg, #fff 0%, #ecebe6 86%, #d6d0c5 100%);
      color: #000;
      border: 1px solid #003c74;
      border-radius: 3px;
    }

    html[data-theme=xp] .fab.active {
      background: #98b5e2;
      color: #000;
    }

    html[data-theme=xp] #tool-host .tool {
      background: #fff;
      border-color: #aca899;
    }

    html[data-theme=xp] .sheet-grab {
      background: #7ba2e7;
    }

    html[data-theme=xp] .sheet-grab::after {
      background: #fff;
    }

    @media (max-width: 760px) {
      html[data-theme=xp] #xp-title {
        height: 22px;
        font-size: 12px;
      }

      html[data-theme=xp] #dock {
        padding: 0 8px;
      }

      html[data-theme=xp] .panel {
        margin: 8px 0;
      }
    }
  </style>
  <script>if (/[?&]theme=xp(&|$)/i.test(location.search)) document.documentElement.dataset.theme = 'xp';</script>
</head>

<body>
  <div id="app">
    <div id="xp-title"><span class="brand-mark"></span><span id="xp-title-text">Pigment</span></div>
    <header id="menubar">
      <div class="brand"><span class="brand-mark"></span><span class="brand-name">Pigment</span></div>
      <div id="menus"></div>
      <div class="spacer"></div>
      <button class="home-link desk-only" id="lang-toggle" style="background:none;border:0;cursor:pointer"></button>
      <a class="home-link desk-only" href="../index.html">← Igarin</a>
      <div class="top-actions">
        <button class="icon-btn" id="btn-undo" data-action="undo"><svg viewBox="0 0 24 24">
            <path d="M9 14 4 9l5-5" />
            <path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" />
          </svg></button>
        <button class="icon-btn" id="btn-redo" data-action="redo"><svg viewBox="0 0 24 24">
            <path d="m15 14 5-5-5-5" />
            <path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13" />
          </svg></button>
        <button class="btn primary small" id="btn-export" data-action="export" data-i18n="top.export"></button>
      </div>
    </header>

    <!-- ── Options bar (changes with the active tool) ── -->
    <div id="optbar">
      <div class="ob-tool"><span id="opt-icon"></span><span id="opt-title"></span></div>

      <div class="opt" data-opt="hand">
        <button class="btn small" data-action="zoom-fit" data-i18n="mi.fit"></button>
        <button class="btn small" data-action="zoom-100">100%</button>
        <span class="ob-hint" data-i18n="hint.hand"></span>
      </div>
      <div class="opt" data-opt="zoom">
        <button class="btn small" data-action="zoom-out">−</button>
        <button class="btn small" data-action="zoom-in">＋</button>
        <button class="btn small" data-action="zoom-fit" data-i18n="mi.fit"></button>
        <button class="btn small" data-action="zoom-100">100%</button>
        <span class="ob-hint" data-i18n="hint.zoom"></span>
      </div>
      <div class="opt" data-opt="select">
        <div class="ob-group">
          <span class="ob-label">X</span><input type="number" class="ob-num" id="sel-x" min="0">
          <span class="ob-label">Y</span><input type="number" class="ob-num" id="sel-y" min="0">
          <span class="ob-label">W</span><input type="number" class="ob-num" id="sel-w" min="1">
          <span class="ob-label">H</span><input type="number" class="ob-num" id="sel-h" min="1">
        </div>
        <span class="ob-sep"></span>
        <div class="ob-group">
          <button class="btn small" data-action="sel-all" data-i18n="sel.all"></button>
          <button class="btn small" data-action="sel-none" data-i18n="sel.none"></button>
          <button class="btn small" data-action="sel-inv" data-i18n="sel.inv"></button>
        </div>
        <span class="ob-sep"></span>
        <div class="ob-group">
          <button class="btn small" data-action="fill-fg" data-i18n="sel.fill"></button>
          <button class="btn small" data-action="clear-sel" data-i18n="sel.clear"></button>
          <button class="btn small" data-action="clear-img" data-i18n="sel.transparent"></button>
          <button class="btn small" data-action="crop-sel" data-i18n="sel.crop"></button>
        </div>
        <span class="ob-hint" data-i18n="hint.select"></span>
      </div>
      <div class="opt" data-opt="crop">
        <div class="ob-group">
          <select id="crop-aspect" data-i18n-aria="crop.aspect" style="width:auto">
            <option value="free" data-i18n="crop.free"></option>
            <option value="orig" data-i18n="crop.orig"></option>
            <option value="1:1" data-i18n="crop.square"></option>
            <option value="4:3">4 : 3</option>
            <option value="3:2">3 : 2</option>
            <option value="16:9">16 : 9</option>
            <option value="5:4">5 : 4</option>
            <option value="2:1">2 : 1</option>
            <option value="21:9">21 : 9</option>
          </select>
          <button class="btn small" id="crop-swap" data-i18n-title="crop.swap" data-i18n-aria="crop.swap">⇄</button>
        </div>
        <div class="ob-group">
          <span class="ob-label">X</span><input type="number" class="ob-num" id="crop-x" min="0">
          <span class="ob-label">Y</span><input type="number" class="ob-num" id="crop-y" min="0">
          <span class="ob-label">W</span><input type="number" class="ob-num" id="crop-w" min="1">
          <span class="ob-label">H</span><input type="number" class="ob-num" id="crop-h" min="1">
        </div>
        <label class="check"><input type="checkbox" id="crop-thirds" checked> <span data-i18n="crop.thirds"></span></label>
        <div class="ob-group">
          <button class="btn small primary" id="crop-apply" data-i18n="crop.apply"></button>
          <button class="btn small" id="crop-reset" data-i18n="common.reset"></button>
        </div>
        <span class="ob-hint" data-i18n="hint.crop"></span>
      </div>
      <div class="opt" data-opt="warp">
        <div class="seg ob-seg" id="warp-mode">
          <button data-mode="distort" class="active" data-i18n="warp.distort"></button>
          <button data-mode="points" data-i18n="warp.points"></button>
          <button data-mode="pins" data-i18n="warp.pins"></button>
          <button data-mode="rectify" data-i18n="warp.rectify"></button>
        </div>
        <div class="ob-group ob-slider warp-pins"><span class="ob-label" data-i18n="warp.reach"></span><input type="range" id="warp-reach" min="0" max="100" step="1" value="50"></div>
        <label class="check warp-pins"><input type="checkbox" id="warp-mesh" checked> <span data-i18n="warp.mesh"></span></label>
        <button class="btn small warp-pts" id="warp-del" data-i18n="warp.delPt"></button>
        <label class="check warp-distort"><input type="checkbox" id="warp-expand"> <span data-i18n="warp.expand"></span></label>
        <div class="ob-group warp-rectify">
          <span class="ob-label" data-i18n="warp.ratio"></span>
          <select id="warp-ratio" style="width:auto">
            <option value="auto" data-i18n="warp.auto"></option>
            <option value="1:1">1 : 1</option>
            <option value="a4" data-i18n="warp.a4"></option>
            <option value="4:3">4 : 3</option>
            <option value="3:2">3 : 2</option>
            <option value="16:9">16 : 9</option>
          </select>
        </div>
        <label class="check warp-rectify"><input type="checkbox" id="warp-crop" checked> <span data-i18n="warp.crop"></span></label>
        <div class="ob-group">
          <button class="btn small primary" id="warp-apply" data-i18n="warp.apply"></button>
          <button class="btn small" id="warp-reset" data-i18n="common.reset"></button>
        </div>
        <span class="ob-hint" id="warp-hint" data-i18n="hint.warpDistort"></span>
      </div>
      <div class="opt" data-opt="brush eraser">
        <div class="ob-group ob-slider"><span class="ob-label" data-i18n="brush.size"></span><input type="range" id="brush-size" min="1" max="400" step="1" value="24"><span class="ob-val" id="brush-size-v"></span></div>
        <div class="ob-group ob-slider"><span class="ob-label" data-i18n="brush.opacity"></span><input type="range" id="brush-opacity" min="1" max="100" step="1" value="100"><span class="ob-val" id="brush-opacity-v"></span></div>
        <div class="ob-group ob-slider"><span class="ob-label" data-i18n="brush.hardness"></span><input type="range" id="brush-hardness" min="0" max="100" step="1" value="80"><span class="ob-val" id="brush-hardness-v"></span></div>
        <label class="check"><input type="checkbox" id="brush-pressure" checked> <span data-i18n="brush.pressure"></span></label>
        <div class="swatches only-brush"></div>
        <span class="ob-hint only-brush" data-i18n="hint.brush"></span>
        <div class="ob-group only-eraser"><span class="ob-label" data-i18n="er.target"></span>
          <select id="eraser-target" style="width:auto">
            <option value="paint" data-i18n="er.paint"></option>
            <option value="image" data-i18n="er.image"></option>
            <option value="both" data-i18n="er.both"></option>
          </select></div>
        <span class="ob-hint only-eraser" data-i18n="hint.eraser"></span>
      </div>
      <div class="opt" data-opt="fill">
        <div class="ob-group ob-slider"><span class="ob-label" data-i18n="fill.tol"></span><input type="range" id="fill-tol" min="0" max="255" step="1" value="32"><span class="ob-val" id="fill-tol-v"></span></div>
        <div class="ob-group ob-slider"><span class="ob-label" data-i18n="brush.opacity"></span><input type="range" id="fill-opacity" min="1" max="100" step="1" value="100"><span class="ob-val" id="fill-opacity-v"></span></div>
        <div class="ob-group"><span class="ob-label" data-i18n="fill.mode"></span>
          <select id="fill-mode" style="width:auto">
            <option value="color" data-i18n="fill.color"></option>
            <option value="clear" data-i18n="fill.clear"></option>
          </select></div>
        <label class="check"><input type="checkbox" id="fill-contig" checked> <span data-i18n="fill.contig"></span></label>
        <div class="swatches"></div>
        <span class="ob-hint" data-i18n="hint.fill"></span>
      </div>
      <div class="opt" data-opt="pick">
        <div class="ob-group">
          <span class="swatch" id="pick-swatch" style="width:22px;height:22px;border-radius:5px;margin:0"></span>
          <span id="pick-hex" style="font-family:var(--mono)">—</span>
        </div>
        <span class="ob-hint" data-i18n="hint.pick"></span>
      </div>
    </div>

    <div id="main">
      <!-- ── Tool rail ── -->
      <nav id="toolstrip">
        <div class="tools" id="tools">

              <path d="M15.5 15.5 21 21M8 10.5h5M10.5 8v5" />
            </svg></button>
          <div class="tool-sep"></div>
          <button class="tool" data-tool="select" data-i18n-title="tool.select" data-i18n-aria="tn.select">
            <svg viewBox="0 0 24 24">
              <path d="M4 7V5a1 1 0 0 1 1-1h2M11 4h2M17 4h2a1 1 0 0 1 1 1v2M20 11v2M20 17v2a1 1 0 0 1-1 1h-2M13 20h-2M7 20H5a1 1 0 0 1-1-1v-2M4 13v-2" />

          <button class="tool" data-tool="crop" data-i18n-title="tool.crop" data-i18n-aria="tn.crop">

              <path d="M6 2v14a2 2 0 0 0 2 2h14M18 22V8a2 2 0 0 0-2-2H2" />

          <button class="tool" data-tool="warp" data-i18n-title="tool.warp" data-i18n-aria="tn.warp">
            <svg viewBox="0 0 24 24">
              <path d="M6.5 5.5 18 3.5l2.5 17-17-2.5z" />
              <path d="M12.2 4.5 12 19.8M5 12l14.2-0.4" opacity=".45" />
              <circle cx="6.5" cy="5.5" r="1.6" />
              <circle cx="18" cy="3.5" r="1.6" />
              <circle cx="20.5" cy="20.5" r="1.6" />
              <circle cx="3.5" cy="18" r="1.6" />
            </svg></button>
          <div class="tool-sep"></div>
          <button class="tool" data-tool="brush" data-i18n-title="tool.brush" data-i18n-aria="tn.brush">
            <svg viewBox="0 0 24 24">
              <path d="M18.4 2.6a2 2 0 0 1 2.9 2.9L11.5 15.3 8.7 12.5ZM7.6 13.9c-2 0-3.6 1.6-3.6 3.6 0 1.3-.7 2.1-1.7 2.6 1 .6 2.3.7 3.7.7a4.2 4.2 0 0 0 4.2-4.2" />
            </svg></button>

      const phone = mqPhone.matches;
      if (phone) $('#app').classList.remove('chrome-hidden');
      $('#app').classList.toggle('sheet-closed', phone && !sheetOpen);
      $$('#dock > .panel').forEach(pn => {
        const on = pn.dataset.tab === tab;
        pn.classList.toggle('m-active', on);
        if (on && phone && pn.tagName === 'DETAILS') pn.open = true;
      });
      $$('#mtabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
      requestAnimationFrame(() => { drawHistogram(); drawCurves(); });
    }
    function setupPhoneLayout() {
      $$('#mtabs button').forEach(b => b.onclick = () => {
        if (b.dataset.tab === mTab && sheetOpen) sheetOpen = false; else sheetOpen = true;
        setMTab(b.dataset.tab);
      });
      // on phones, panel headers are titles, not toggles
      $$('#dock summary').forEach(sm => sm.addEventListener('click', e => { if (mqPhone.matches) e.preventDefault(); }));
      // drag the grabber to resize the sheet
      const grab = $('#sheet-grab');
      let g = null;
      grab.addEventListener('pointerdown', e => { grab.setPointerCapture(e.pointerId); g = { y: e.clientY, h: $('#dock').getBoundingClientRect().height }; });
      grab.addEventListener('pointermove', e => {
        if (!g) return;
        const h = clamp(g.h - (e.clientY - g.y), 140, innerHeight * 0.75);
        $('#app').style.setProperty('--sheet-h', h + 'px');
      });
      const up = () => { g = null; drawHistogram(); drawCurves(); };
      grab.addEventListener('pointerup', up); grab.addEventListener('pointercancel', up);
      mqPhone.addEventListener('change', applyLayout);
      applyLayout();
    }
    function initUI() {
      buildSliders(); setupCurves(); applyI18n();
      $('#lang-toggle').onclick = toggleLang;
      $$('.tool').forEach(b => b.onclick = () => setTool(b.dataset.tool));
      setupPhoneLayout();
      $$('[data-action]').forEach(b => b.addEventListener('click', () => ACTIONS[b.dataset.action]()));
      $('#btn-auto').onclick = e => { e.preventDefault(); autoTone(); };
      $('#btn-reset-adj').onclick = e => { e.preventDefault(); resetAdjust(); };
      $('#adj-invert').onchange = e => { if (!doc.base) { e.target.checked = false; return; } adjust.invert = e.target.checked; adjustChanged(); snapshot('h.invert'); };

      // crop
      $('#crop-aspect').onchange = () => { if (doc.base) cropInit(); };
      $('#crop-swap').onclick = () => { cropSwap = !cropSwap; if (doc.base) cropInit(); };
      ['x', 'y', 'w', 'h'].forEach(k => $('#crop-' + k).addEventListener('change', () => cropFromInputs(k)));
      $('#crop-thirds').onchange = e => { cropThirds = e.target.checked; requestRender(); };
      $('#crop-apply').onclick = applyCrop;
      $('#crop-reset').onclick = () => doc.base && cropInit();

      // colors
      $$('.swatches').forEach(sw => ['#ffffff', '#000000', '#ff4d6d', '#ffd23d', '#4fd18b', '#4fa3ff', '#b06cf0'].forEach(col => {
        const b = document.createElement('button'); b.style.background = col;
        b.title = col; b.setAttribute('aria-label', col); b.onclick = () => setFg(col); sw.appendChild(b);
      }));
      $('#fg-color').oninput = e => colors.fg = e.target.value;
      $('#bg-color').oninput = e => colors.bg = e.target.value;
      $('#swap-colors').onclick = swapColors;
      $('#reset-colors').onclick = resetColors;

      // brush
      $('#brush-size').oninput = e => setBrushSize(+e.target.value);
      $('#brush-opacity').oninput = e => setBrushOpacity(+e.target.value);
      $('#brush-hardness').oninput = e => { brush.hardness = e.target.value / 100; $('#brush-hardness-v').textContent = e.target.value + '%'; };
      $('#brush-pressure').onchange = e => brush.pressure = e.target.checked;
      setBrushSize(brush.size); setBrushOpacity(100); $('#brush-hardness-v').textContent = '80%';

      // fill
      $('#fill-tol').oninput = e => { fillOpt.tol = +e.target.value; $('#fill-tol-v').textContent = e.target.value; };
      $('#fill-opacity').oninput = e => setFillOpacity(+e.target.value);
      $('#fill-contig').onchange = e => fillOpt.contiguous = e.target.checked;
      $('#fill-mode').onchange = e => fillOpt.mode = e.target.value;
      $('#eraser-target').onchange = e => eraserTarget = e.target.value;
      $('#fill-tol-v').textContent = fillOpt.tol; setFillOpacity(100);

      // perspective
      $$('#warp-mode button').forEach(b => b.onclick = () => setWarpMode(b.dataset.mode));
      $('#warp-apply').onclick = applyWarp;
      $('#warp-reset').onclick = () => doc.base && warpInit();
      $('#warp-expand').onchange = () => warpChanged();
      $('#warp-reach').oninput = () => warpChanged();
      $('#warp-mesh').onchange = () => requestRender();
      $('#warp-del').onclick = () => removeWarpPoint(warp.active);
      $('#warp-ratio').onchange = () => requestRender();
      $('#warp-crop').onchange = () => requestRender();
      warpSyncUI();

      // selection fields
      ['x', 'y', 'w', 'h'].forEach(k => $('#sel-' + k).addEventListener('change', selFromInputs));

      // layers
      $('#paint-visible').onchange = e => { layer.paintVisible = e.target.checked; requestRender(); };
      $('#paint-opacity').oninput = e => { layer.paintOpacity = e.target.value / 100; $('#paint-opacity-v').textContent = e.target.value + '%'; requestRender(); };

      // compare (press & hold)
      for (const cb of [$('#btn-compare'), $('#fab-compare')]) {
        cb.addEventListener('pointerdown', e => { e.preventDefault(); setCompare(true); });
        ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => cb.addEventListener(ev, () => setCompare(false)));
        cb.addEventListener('contextmenu', e => e.preventDefault());
      }

      // redraw small canvases when panels open / dock resizes
      $$('#dock details').forEach(d => d.addEventListener('toggle', () => { drawHistogram(); drawCurves(); }));
      new ResizeObserver(() => { drawHistogram(); drawCurves(); }).observe($('#dock'));

      window.addEventListener('beforeunload', e => { if (hIndex > 0) { e.preventDefault(); e.returnValue = ''; } });

      setTool('hand'); syncAdjustUI(); renderHistory(); resizeView();
    }
    initUI();
  </script>
</body>

</html>
